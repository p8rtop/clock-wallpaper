<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>时钟壁纸</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000000;
            overflow: hidden;
            font-family: Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: none;
            z-index: 1;
        }

        /* 时钟样式 */
        .clock {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #d0d0d0;
            pointer-events: none;
            z-index: 999;
            font-family: Arial, sans-serif;
            text-shadow: 0 0 8px rgba(0,0,0,0.5);
            transition: transform 0.05s ease-out;
        }
        .time {
            font-size: 100px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 4px;
            background: rgba(0,0,0,0.4);
            padding: 0.2em 0.5em;
            border-radius: 24px;
            backdrop-filter: blur(2px);
        }
        .date {
            font-size: 32px;
            color: #909090;
            background: rgba(0,0,0,0.3);
            padding: 0.2em 1em;
            border-radius: 40px;
            backdrop-filter: blur(2px);
        }

        @media (max-width: 768px) and (orientation: portrait) {
            .time { font-size: 14vw; }
            .date { font-size: 5vw; }
        }
        @media (max-width: 1024px) and (orientation: landscape) {
            .time { font-size: 10vh; }
            .date { font-size: 3.5vh; }
        }

        html {
            overflow: hidden;
            background: #000;
        }

        /* 游戏入口按钮容器 */
        .game-menu {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            z-index: 1000;
            pointer-events: auto;
        }

        .game-button {
            padding: 18px 40px;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            backdrop-filter: blur(10px);
            letter-spacing: 2px;
        }

        .game-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.6);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .game-button:active {
            transform: translateY(-1px);
        }

        .game-button.breakout {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        .game-button.breakout:hover {
            box-shadow: 0 6px 25px rgba(245, 87, 108, 0.6);
        }

        .game-button.shooter {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        .game-button.shooter:hover {
            box-shadow: 0 6px 25px rgba(79, 172, 254, 0.6);
        }

        .game-button.snake {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            box-shadow: 0 4px 15px rgba(67, 233, 123, 0.4);
        }

        .game-button.snake:hover {
            box-shadow: 0 6px 25px rgba(67, 233, 123, 0.6);
        }

        @media (max-width: 768px) {
            .game-menu {
                flex-direction: column;
                gap: 15px;
                bottom: 40px;
            }

            .game-button {
                padding: 15px 35px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="clock">
    <div class="time">00:00:00</div>
    <div class="date">2025-01-01 星期一</div>
</div>

<!-- 游戏入口菜单 -->
<div class="game-menu">
    <a href="clock-打砖块.html" class="game-button breakout">🧱打砖块</a>
    <a href="clock-飞机大战.html" class="game-button shooter">✈️飞机大战</a>
    <a href="clock-贪吃蛇.html" class="game-button snake">🐍贪吃蛇</a>
</div>

<script>
    (function() {
        // ---------- DOM ----------
        const canvas = document.getElementById('bgCanvas');
        let ctx = canvas.getContext('2d');

        // ---------- 全局配置 ----------
        const CONFIG = {
            STAR_COUNT: 130,
            TRAIL_LENGTH: 12,
        };

        let animationId = null;
        let canvasWidth = window.innerWidth;
        let canvasHeight = window.innerHeight;

        // ---------- 星空粒子系统 ----------
        let stars = [];

        class Star {
            constructor() {
                this.x = Math.random() * canvasWidth;
                this.y = Math.random() * canvasHeight;
                this.size = 0.8 + Math.random() * 2.2;
                this.alpha = 0.3 + Math.random() * 0.6;
                this.speedX = (Math.random() - 0.5) * 0.08;
                this.speedY = (Math.random() - 0.5) * 0.05 - 0.02;
                this.twinkleSpeed = 0.5 + Math.random() * 2;
                this.phase = Math.random() * Math.PI * 2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < -10) this.x = canvasWidth + 5;
                if (this.x > canvasWidth + 10) this.x = -5;
                if (this.y < -10) this.y = canvasHeight + 5;
                if (this.y > canvasHeight + 10) this.y = -10;
                this.alpha = 0.3 + 0.45 * (0.8 + 0.4 * Math.sin(Date.now() * 0.002 * this.twinkleSpeed + this.phase));
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.min(0.85, Math.max(0.2, this.alpha));
                ctx.fillStyle = `rgba(210, 220, 240, ${ctx.globalAlpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                if (this.size > 1.5 && this.alpha > 0.5) {
                    ctx.globalAlpha = 0.2;
                    ctx.fillStyle = '#aaccff';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 1.8, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < CONFIG.STAR_COUNT; i++) stars.push(new Star());
        }

        function updateStars() {
            for (let s of stars) s.update();
        }

        function drawStars() {
            for (let s of stars) s.draw(ctx);
        }

        // ---------- 彩虹像素拖尾 ----------
        let mouseTrail = [];
        let currentMouseX = canvasWidth/2;
        let currentMouseY = canvasHeight/2;

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let mouseX = (e.clientX - rect.left) * scaleX;
            let mouseY = (e.clientY - rect.top) * scaleY;
            mouseX = Math.min(canvasWidth, Math.max(0, mouseX));
            mouseY = Math.min(canvasHeight, Math.max(0, mouseY));
            currentMouseX = mouseX;
            currentMouseY = mouseY;
            mouseTrail.unshift({ x: mouseX, y: mouseY, age: 0 });
            if (mouseTrail.length > CONFIG.TRAIL_LENGTH) mouseTrail.pop();
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let touchX = (touch.clientX - rect.left) * scaleX;
            let touchY = (touch.clientY - rect.top) * scaleY;
            touchX = Math.min(canvasWidth, Math.max(0, touchX));
            touchY = Math.min(canvasHeight, Math.max(0, touchY));
            currentMouseX = touchX;
            currentMouseY = touchY;
            mouseTrail.unshift({ x: touchX, y: touchY, age: 0 });
            if (mouseTrail.length > CONFIG.TRAIL_LENGTH) mouseTrail.pop();
        });
        canvas.addEventListener('touchstart', (e) => e.preventDefault());

        function updateTrailAges() {
            for (let i = 0; i < mouseTrail.length; i++) mouseTrail[i].age += 0.2;
            mouseTrail = mouseTrail.filter(t => t.age < 2.5);
        }

        function drawRainbowTrail() {
            if (mouseTrail.length === 0) return;
            for (let i = 0; i < mouseTrail.length; i++) {
                const point = mouseTrail[i];
                const ageFactor = Math.max(0, 1 - point.age / 2.5);
                if (ageFactor <= 0) continue;
                const hue = (Date.now() * 0.008 + i * 18) % 360;
                ctx.fillStyle = `hsl(${hue}, 70%, 65%)`;
                const size = 5 + 2 * ageFactor;
                ctx.fillRect(point.x - size/2, point.y - size/2, size, size);
                ctx.fillStyle = `hsl(${hue}, 80%, 72%)`;
                ctx.fillRect(point.x - size/3, point.y - size/3, size/2, size/2);
            }
            ctx.shadowBlur = 0;
        }

        // ---------- 绘图 ----------
        function draw() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            drawStars();
            drawRainbowTrail();
        }

        // 自适应重置
        function resizeAndReset() {
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            initStars();
            mouseTrail = [];
        }

        window.addEventListener('resize', () => {
            resizeAndReset();
        });

        function gameLoop() {
            if (!canvas.isConnected) return;
            updateStars();
            updateTrailAges();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function init() {
            resizeAndReset();
            gameLoop();
        }

        init();
    })();

    // 独立时钟模块
    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const week = "日一二三四五六"[now.getDay()];
        document.querySelector(".time").innerText = `${h}:${m}:${s}`;
        document.querySelector(".date").innerText = `${year}-${month}-${day} 星期${week}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
</script>
</body>
</html>
