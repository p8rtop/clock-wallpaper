<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>飞机大战 · 智能改进版</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
        body{background:#000;overflow:hidden;font-family:'Courier New',monospace;height:100vh;width:100vw;position:fixed}
        canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%;cursor:none;z-index:1}
        .clock{position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;color:rgba(220,235,255,.94);pointer-events:none;z-index:999;font-family:'Segoe UI','Orbitron',monospace;text-shadow:0 0 8px rgba(0,0,0,.6),0 0 2px rgba(100,150,255,.5);letter-spacing:2px}
        .time{font-size:100px;font-weight:700;margin-bottom:20px;background:transparent;padding:0;border:none;box-shadow:none;cursor:pointer;pointer-events:auto}
        .date{font-size:32px;font-weight:400;background:transparent;padding:0}
        @keyframes clockShake{0%{transform:translate(0,0) rotate(0)}20%{transform:translate(-3px,1px) rotate(-.6deg)}40%{transform:translate(3px,-1px) rotate(.6deg)}60%{transform:translate(-1px,.5px) rotate(.2deg)}80%{transform:translate(1px,-.5px) rotate(-.2deg)}100%{transform:translate(0,0) rotate(0)}}
        .shake-clock{animation:clockShake .18s ease-in-out 2}
        @media(max-width:768px)and(orientation:portrait){.time{font-size:14vw}.date{font-size:5vw}}
        @media(max-width:1024px)and(orientation:landscape){.time{font-size:10vh}.date{font-size:3.5vh}}
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div class="clock"><div class="time">00:00:00</div><div class="date">2025-01-01 星期四</div></div>
<script>
    (function(){
        const canvas=document.getElementById('gameCanvas');
        let ctx=canvas.getContext('2d');
        const clockEl=document.querySelector('.clock');
        let cw=window.innerWidth,ch=window.innerHeight;
        const C={PW:28,PH:28,INV:30,MAX_LIVES:5,MAX_SH:99,BW:5,BH:12,BSPEED:-7.5,SHOOT_DELAY:4,EW:28,EH:28,DROP_RATE:.28,PICK_R:32,SH_COST:10,STARS:150,TRAIL:10,CPART:12,MAX_WLV:3,SLOW_DUR:420,AIM_DUR:600,FIRE_DUR:600,MAG_DUR:900,WING_DUR:900,BSH_DUR:1800,F_ATTR:3.0,F_AVOID:2.8,F_URGENT:7.0,F_BULLET:2.6,F_POWER:4.5,MAX_STEER:8.5};
        const MAX_LV=999;
        // ===== 关卡公式 =====
        function lvCfg(lv){
            const boss=lv%10===0;
            const d=Math.sqrt(lv);
            return{
                killTarget:boss?0:Math.min(60,3+Math.floor(lv*.55)),
                spawnInt:Math.max(5,32-lv*.027),
                eSpdMin:1.5+d*.13, eSpdMax:2.8+d*.13,
                maxE:Math.min(28,7+Math.floor(lv/40)),
                eShootDel:Math.max(10,60-lv*.05),
                eHP:Math.min(20,1+Math.floor(lv/70)),
                isBoss:boss,
                bossHP:boss?Math.floor(25+lv*3.5):0,
                bossW:boss?Math.min(200,70+d*4):0,
                bossH:boss?Math.min(160,55+d*3):0,
                bossShootDel:boss?Math.max(8,42-lv*.035):0,
                bossSpd:boss?.6+d*.025:0,
                powerRate:Math.min(.42,.28+lv*.00014)
            };
        }
        let running=true,curLv=1,killCnt=0;
        let lvState='playing',lvTimer=0,lvConf=null,boss=null;
        let P={x:cw/2-14,y:ch-80,w:C.PW,h:C.PH,lives:C.MAX_LIVES,shield:99,invT:0,wLv:0,slowT:0,aimT:0,fireT:0,magT:0,wingT:0,bshT:0};
        let wingmen=[],bullets=[],enemies=[],eBullets=[],powerups=[];
        let score=0,shootCD=0,spawnCD=12;
        let kb={l:0,r:0,u:0,d:0},manual=false;
        let cParts=[],eParts=[],stars=[],trail=[],mX=cw/2,mY=ch/2,modeNote=null;
        function shade(c,p){let R=parseInt(c.slice(1,3),16),G=parseInt(c.slice(3,5),16),B=parseInt(c.slice(5,7),16);R=Math.min(255,Math.max(0,R+p));G=Math.min(255,Math.max(0,G+p));B=Math.min(255,Math.max(0,B+p));return'#'+((1<<24)+(R<<16)+(G<<8)+B).toString(16).slice(1)}
        function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath()}
        function shake(){if(!clockEl)return;clockEl.classList.add('shake-clock');setTimeout(()=>clockEl.classList.remove('shake-clock'),240)}
        function buyShield(){while(score>=C.SH_COST&&P.shield<C.MAX_SH){score-=C.SH_COST;P.shield++;addFX(P.x+P.w/2,P.y+P.h/2,'#88ffaa')}}
        function addScore(n){score+=n;buyShield();}
        class FX{constructor(x,y,vx,vy,c,s,l){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.c=c;this.s=s;this.l=l;this.ml=l}update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.12;this.l--}draw(c){c.globalAlpha=Math.min(1,this.l/this.ml*.9);c.fillStyle=this.c;c.beginPath();c.arc(this.x,this.y,this.s/2,0,Math.PI*2);c.fill()}}
        function addFX(px,py,bc='#ffaa66'){for(let i=0;i<C.CPART;i++){let a=Math.random()*Math.PI*2,sp=1+Math.random()*3,sz=2+Math.random()*4,l=10+Math.random()*12,c=bc;if(Math.random()>.6)c='#ff8855';if(Math.random()>.8)c='#ffdd99';cParts.push(new FX(px,py,Math.cos(a)*sp,Math.sin(a)*sp,c,sz,l))}}
        function spawnEP(x,y,c){eParts.push({x:x+(Math.random()-.5)*4,y,vx:(Math.random()-.5)*.8,vy:1+Math.random()*2,l:8+Math.random()*8,ml:16,s:1.5+Math.random()*2,c})}
        function updateEP(){for(let i=eParts.length-1;i>=0;i--){let p=eParts[i];p.x+=p.vx;p.y+=p.vy;p.l--;if(p.l<=0)eParts.splice(i,1)}if(eParts.length>150)eParts.splice(0,eParts.length-150)}
        function drawEP(){ctx.save();for(let p of eParts){let a=Math.max(0,p.l/p.ml*.7);ctx.globalAlpha=a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s*(p.l/p.ml),0,Math.PI*2);ctx.fill()}ctx.restore()}
        class Star{constructor(){this.x=Math.random()*cw;this.y=Math.random()*ch;this.sz=.7+Math.random()*2.2;this.a=.3+Math.random()*.7;this.sx=(Math.random()-.5)*.04;this.sy=(Math.random()-.5)*.04+.02;this.ts=.6+Math.random()*2.2;this.ph=Math.random()*Math.PI*2}update(){this.x+=this.sx;this.y+=this.sy;if(this.x<-10)this.x=cw+10;if(this.x>cw+10)this.x=-10;if(this.y<-10)this.y=ch+10;if(this.y>ch+10)this.y=-10;this.a=.3+.5*(.7+.4*Math.sin(Date.now()*.002*this.ts+this.ph))}draw(c){c.save();c.globalAlpha=Math.min(.9,Math.max(.2,this.a));c.fillStyle=`rgba(220,230,255,${c.globalAlpha})`;c.beginPath();c.arc(this.x,this.y,this.sz,0,Math.PI*2);c.fill();c.restore()}}
        function initStars(){stars=[];for(let i=0;i<C.STARS;i++)stars.push(new Star())}
        canvas.addEventListener('mousemove',e=>{let r=canvas.getBoundingClientRect(),sx=cw/r.width,sy=ch/r.height;mX=Math.min(cw,Math.max(0,(e.clientX-r.left)*sx));mY=Math.min(ch,Math.max(0,(e.clientY-r.top)*sy));trail.unshift({x:mX,y:mY,age:0});if(trail.length>C.TRAIL)trail.pop()});
        canvas.addEventListener('touchmove',e=>{e.preventDefault();let r=canvas.getBoundingClientRect(),t=e.touches[0],sx=cw/r.width,sy=ch/r.height;mX=Math.min(cw,Math.max(0,(t.clientX-r.left)*sx));mY=Math.min(ch,Math.max(0,(t.clientY-r.top)*sy));trail.unshift({x:mX,y:mY,age:0});if(trail.length>C.TRAIL)trail.pop()});
        canvas.addEventListener('touchstart',e=>e.preventDefault());
        document.addEventListener('keydown',e=>{if(e.key===' '||e.code==='Space'){e.preventDefault();manual=!manual;shake();modeNote={text:manual?'MANUAL':'AUTO',t:Date.now(),dur:900};return}switch(e.key){case'ArrowLeft':kb.l=1;break;case'ArrowRight':kb.r=1;break;case'ArrowUp':kb.u=1;break;case'ArrowDown':kb.d=1;break}});
        document.addEventListener('keyup',e=>{switch(e.key){case'ArrowLeft':kb.l=0;break;case'ArrowRight':kb.r=0;break;case'ArrowUp':kb.u=0;break;case'ArrowDown':kb.d=0;break}});
        function initLv(lv){curLv=Math.min(lv,MAX_LV);lvConf=lvCfg(curLv);killCnt=0;enemies=[];eBullets=[];powerups=[];bullets=[];boss=null;lvState=lvConf.isBoss?'boss_intro':'playing';lvTimer=lvConf.isBoss?140:0;spawnCD=40}
        function nextLv(){if(curLv>=MAX_LV){lvState='victory';lvTimer=360;return}initLv(curLv+1)}
        function updLvState(){if(lvState==='boss_intro'){lvTimer--;if(lvTimer<=0){lvState='boss';spawnBoss()}return}if(lvState==='clear'){lvTimer--;if(lvTimer<=0)nextLv();return}if(lvState==='victory'){lvTimer--;if(lvTimer<=0){curLv=1;initLv(1)}return}if(lvState==='playing'&&!lvConf.isBoss&&killCnt>=lvConf.killTarget){lvState='clear';lvTimer=100}}
        // ===== Boss生成 =====
        function spawnBoss(){
            const c=lvConf;
            const tgtY=Math.max(60,Math.floor(ch*0.12));
            boss={x:cw/2-c.bossW/2,y:-c.bossH-60,w:c.bossW,h:c.bossH,hp:c.bossHP,maxHp:c.bossHP,tgtY,phase:0,dir:1,spd:c.bossSpd,shootT:80,shootDel:c.bossShootDel,pat:0,patCnt:0,flash:0,lv:curLv}
        }
        function updBoss(){if(!boss)return;if(boss.phase===0){boss.y+=1.2;if(boss.y>=boss.tgtY){boss.y=boss.tgtY;boss.phase=1}return}boss.x+=boss.dir*boss.spd;if(boss.x<15){boss.x=15;boss.dir=1}if(boss.x+boss.w>cw-15){boss.x=cw-boss.w-15;boss.dir=-1}if(boss.shootT<=0){bossAtk();boss.shootT=boss.shootDel;boss.patCnt++}else boss.shootT--;if(boss.flash>0)boss.flash--}
        function bossAtk(){if(!boss)return;const bx=boss.x+boss.w/2,by=boss.y+boss.h,hpR=boss.hp/boss.maxHp,spd=4.8+Math.sqrt(curLv)*.08;
            let p=hpR>.6?boss.patCnt%2:hpR>.3?boss.patCnt%3:boss.patCnt%4;
            switch(p){
                case 0:{const n=3+Math.min(8,Math.floor(curLv/30)),sp=Math.PI*.5;for(let i=0;i<n;i++){const a=Math.PI/2-sp/2+sp*(i/(n-1));eBullets.push({x:bx-2,y:by,w:5,h:10,sx:Math.cos(a)*spd*.7,sy:Math.sin(a)*spd,boss:true})}break}
                case 1:{const n=8+Math.min(16,Math.floor(curLv/25));for(let i=0;i<n;i++){const a=Math.PI*2/n*i+Date.now()*.001;eBullets.push({x:bx-2,y:boss.y+boss.h/2,w:4,h:8,sx:Math.cos(a)*spd*.65,sy:Math.sin(a)*spd*.65,boss:true})}break}
                case 2:{const dx=P.x+P.w/2-bx,dy=P.y+P.h/2-by,a=Math.atan2(dy,dx);for(let i=0;i<2;i++){const s=(i-.5)*.3;eBullets.push({x:bx-3,y:by,w:6,h:12,sx:Math.cos(a+s)*spd*1.1,sy:Math.sin(a+s)*spd*1.1,boss:true})}break}
                case 3:{if(boss&&enemies.length<4)for(let i=0;i<2;i++)enemies.push({x:boss.x+(i?-20:boss.w+5),y:boss.y+boss.h/2,w:28,h:28,speedY:1.5+Math.random(),shootTimer:30+Math.floor(Math.random()*30),color:'#9a5a5a',hp:1});if(boss)for(let i=0;i<3;i++){const a=Math.PI*.35+Math.PI*.3*(i/2);eBullets.push({x:bx-2,y:by,w:5,h:10,sx:Math.cos(a)*3,sy:Math.sin(a)*5,boss:true})}break}}}
        function hitBoss(){if(!boss||boss.phase===0)return;for(let i=bullets.length-1;i>=0;i--){if(!boss)break;let b=bullets[i];if(b.x<boss.x+boss.w&&b.x+b.w>boss.x&&b.y<boss.y+boss.h&&b.y+b.h>boss.y){boss.hp-=(b.damage||1);boss.flash=5;addFX(b.x+b.w/2,b.y+b.h/2,'#ffaa66');bullets.splice(i,1);if(boss.hp<=0)bossDefeat()}}}
        function bossDefeat(){for(let i=0;i<12;i++)addFX(boss.x+Math.random()*boss.w,boss.y+Math.random()*boss.h,'#ff6644');const n=4+Math.min(10,Math.floor(curLv/50));for(let i=0;i<n;i++)spawnPow(boss.x+Math.random()*boss.w-10,boss.y+Math.random()*boss.h);addScore(20+curLv*5);shake();boss=null;lvState='clear';lvTimer=120}

        // ========== 增强AI模块 ==========
        // 获取最近敌人 (用于自瞄)
        function getClosestEnemy(){
            let best=null, bestDist=Infinity;
            const pcx=P.x+P.w/2, pcy=P.y+P.h/2;
            for(let e of enemies){
                const ecx=e.x+e.w/2, ecy=e.y+e.h/2;
                const d=Math.hypot(ecx-pcx, ecy-pcy);
                if(d<bestDist){
                    bestDist=d;
                    best=e;
                }
            }
            return best;
        }
        // 计算周围子弹密度 (影响避障权重)
        function getBulletDensity(radius=120){
            let cnt=0;
            const pcx=P.x+P.w/2, pcy=P.y+P.h/2;
            for(let eb of eBullets){
                const bx=eb.x+eb.w/2, by=eb.y+eb.h/2;
                if(Math.hypot(bx-pcx, by-pcy)<radius) cnt++;
            }
            return cnt;
        }
        // 自瞄射击：子弹自动偏向最近敌人
        function shoot(){
            const cx=P.x+P.w/2, cy=P.y-6, lv=P.wLv;
            let target=null;
            if(P.aimT>0 || enemies.length>0) target=getClosestEnemy();
            let aimAngle=0;
            if(target){
                const tx=target.x+target.w/2, ty=target.y+target.h/2;
                const dx=tx-cx, dy=ty-cy;
                aimAngle=Math.atan2(dy,dx);
                // 限制最大偏角 ±0.35 rad (20度)
                aimAngle=Math.min(0.35, Math.max(-0.35, aimAngle));
            }
            const applyAim=(b, angle)=>{
                if(Math.abs(angle)>0.01){
                    b.angle=angle;
                    b.sx=Math.sin(angle)*1.5; // 水平偏移速度
                }
                return b;
            };
            if(lv===0){
                let b={x:cx-C.BW/2,y:cy,w:C.BW,h:C.BH,damage:1};
                if(aimAngle!==0) applyAim(b, aimAngle);
                bullets.push(b);
            } else if(lv===1){
                let b1={x:cx-C.BW/2-5,y:cy,w:C.BW,h:C.BH,damage:1};
                let b2={x:cx-C.BW/2+5,y:cy,w:C.BW,h:C.BH,damage:1};
                if(aimAngle!==0){
                    applyAim(b1, aimAngle*0.7);
                    applyAim(b2, aimAngle*0.7);
                }
                bullets.push(b1,b2);
            } else if(lv===2){
                let b1={x:cx-C.BW/2,y:cy,w:C.BW,h:C.BH,damage:1,angle:-0.2};
                let b2={x:cx-C.BW/2,y:cy,w:C.BW,h:C.BH,damage:1};
                let b3={x:cx-C.BW/2,y:cy,w:C.BW,h:C.BH,damage:1,angle:0.2};
                if(aimAngle!==0){
                    b1.angle=aimAngle-0.15;
                    b2.angle=aimAngle;
                    b3.angle=aimAngle+0.15;
                    for(let b of [b1,b2,b3]) if(b.angle) applyAim(b, b.angle);
                }
                bullets.push(b1,b2,b3);
            } else {
                let b1={x:cx-C.BW/2,y:cy,w:C.BW,h:C.BH,damage:1,angle:-0.3};
                let b2={x:cx-C.BW/2,y:cy,w:C.BW,h:C.BH,damage:1,angle:-0.1};
                let b3={x:cx-C.BW/2,y:cy,w:C.BW,h:C.BH,damage:1,angle:0.1};
                let b4={x:cx-C.BW/2,y:cy,w:C.BW,h:C.BH,damage:1,angle:0.3};
                if(aimAngle!==0){
                    b1.angle=aimAngle-0.2;
                    b2.angle=aimAngle-0.07;
                    b3.angle=aimAngle+0.07;
                    b4.angle=aimAngle+0.2;
                    for(let b of [b1,b2,b3,b4]) if(b.angle) applyAim(b, b.angle);
                }
                bullets.push(b1,b2,b3,b4);
            }
        }
        // 改进的AI移动（增强动态力场）
        function aiMove(){
            if(P.invT>0) P.invT--;
            const useKB=manual&&(kb.l||kb.r||kb.u||kb.d);
            if(useKB){
                const ms=5;
                if(kb.l) P.x-=ms;
                if(kb.r) P.x+=ms;
                if(kb.u) P.y-=ms;
                if(kb.d) P.y+=ms;
            } else {
                let fX=0,fY=0;
                const pc={x:P.x+P.w/2, y:P.y+P.h/2};
                // 动态参数：敌人数越多，回避权重提升
                const enemyCount=enemies.length;
                const dynAvoid=Math.min(1.6, 1.0 + enemyCount*0.08);
                const dynUrgent=Math.min(2.2, 1.0 + enemyCount*0.12);
                // 子弹密度影响紧急回避
                const bulletDensity=getBulletDensity(100);
                const densityFactor=1.0 + Math.min(1.2, bulletDensity*0.08);

                // ---- 攻击目标选择（优先攻击最近且下方敌人）----
                let best=null, bestSc=-1e9;
                for(let e of enemies){
                    const ec={x:e.x+e.w/2, y:e.y+e.h/2};
                    const d=Math.hypot(pc.x-ec.x, pc.y-ec.y);
                    let sc=-d*0.2;
                    if(ec.y>pc.y-60) sc+=20;
                    if(e.hp<=1) sc+=15;
                    if(e.shootTimer<20) sc+=10;
                    if(sc>bestSc){ bestSc=sc; best=e; }
                }
                if(best){
                    const tx=best.x+best.w/2, ty=best.y+best.h/2;
                    const iy=ty+55, id=Math.hypot(tx-pc.x, iy-pc.y);
                    if(id>8){
                        let a=C.F_ATTR * Math.min(1.6, 100/(id+15));
                        if(id<25) a*=0.35;
                        fX+=(tx-pc.x)/id * a;
                        fY+=(iy-pc.y)/id * a;
                    }
                }
                // ---- Boss 智能策略 (基于弹幕模式) ----
                if(boss && boss.phase===1){
                    const bcx=boss.x+boss.w/2, bcy=boss.y+boss.h/2;
                    // 判断Boss当前弹幕模式 (patCnt%4)
                    const pattern = boss.patCnt % 4;
                    let targetYoffset = 60; // 默认
                    if(pattern===0 || pattern===1){
                        // 扇形/圆形弹幕 -> 站正下方空隙大
                        targetYoffset = 45;
                    } else if(pattern===2){
                        // 跟踪弹幕 -> 需要横向闪避，站稍远
                        targetYoffset = 75;
                    } else {
                        targetYoffset = 60;
                    }
                    const iy = boss.y + boss.h + targetYoffset;
                    fX += Math.sign(bcx-pc.x) * Math.min(Math.abs(bcx-pc.x)*0.035, 1.8) * 2.6;
                    fY += (iy-pc.y>0 ? 0.9 : -0.5) * Math.min(Math.abs(iy-pc.y)*0.025, 2.2) * 1.3;
                }
                // ---- 道具吸引力 + 危险评估 (避开危险区域的道具) ----
                for(let p of powerups){
                    const bc={x:p.x+p.w/2, y:p.y+p.h/2};
                    const dx=bc.x-pc.x, dy=bc.y-pc.y;
                    const d=Math.hypot(dx,dy);
                    if(d<280 && d>0.1){
                        // 评估道具周围危险度 (附近敌人子弹)
                        let danger=0;
                        for(let e of enemies){
                            const ed=Math.hypot(e.x+e.w/2-bc.x, e.y+e.h/2-bc.y);
                            if(ed<70) danger+=0.4;
                        }
                        for(let eb of eBullets){
                            const bd=Math.hypot(eb.x+eb.w/2-bc.x, eb.y+eb.h/2-bc.y);
                            if(bd<50) danger+=0.6;
                        }
                        let weight=C.F_POWER*(1-d/280);
                        switch(p.type){

        function drawWing(){ wingmen.forEach(w=>{ const wx=w.x+6,wy=w.y+5; ctx.save(); ctx.translate(wx,wy); ctx.scale(.7,.7); const fL=5+Math.random()*3; let fg=ctx.createLinearGradient(0,4,0,4+fL); fg.addColorStop(0,'rgba(200,240,255,.8)'); fg.addColorStop(.4,'rgba(80,180,255,.5)'); fg.addColorStop(1,'rgba(255,60,0,0)'); ctx.fillStyle=fg; ctx.beginPath(); ctx.moveTo(-1.5,4); ctx.quadraticCurveTo(0,4+fL,1.5,4); ctx.fill(); let bg=ctx.createLinearGradient(-6,0,6,0); bg.addColorStop(0,'#1565c0'); bg.addColorStop(.5,'#42a5f5'); bg.addColorStop(1,'#1565c0'); ctx.fillStyle=bg; ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(2,-4); ctx.lineTo(2.5,-1); ctx.lineTo(6,1); ctx.lineTo(6.5,3); ctx.lineTo(2.5,2); ctx.lineTo(2,4.5); ctx.lineTo(0,3.5); ctx.lineTo(-2,4.5); ctx.lineTo(-2.5,2); ctx.lineTo(-6.5,3); ctx.lineTo(-6,1); ctx.lineTo(-2.5,-1); ctx.lineTo(-2,-4); ctx.closePath(); ctx.fill(); ctx.fillStyle='rgba(130,210,255,.8)'; ctx.beginPath(); ctx.ellipse(0,-2.5,1.2,2.2,0,0,Math.PI*2); ctx.fill(); ctx.restore(); if(Math.random()<.3) spawnEP(wx,wy+4,'rgba(66,165,245,.5)'); }); }

        function drawBoss(){ if(!boss) return; const cx=boss.x+boss.w/2,cy=boss.y+boss.h/2,hw=boss.w/2,hh=boss.h/2,fl=boss.flash>0; ctx.save(); ctx.translate(cx,cy); const fL=14+Math.random()*8; let fg=ctx.createLinearGradient(0,-hh,0,-hh-fL); fg.addColorStop(0,fl?'#ffffff':'rgba(255,100,50,.8)'); fg.addColorStop(.5,fl?'#ffaaaa':'rgba(255,50,20,.4)'); fg.addColorStop(1,'rgba(255,0,0,0)'); ctx.fillStyle=fg; ctx.beginPath(); ctx.moveTo(-hw*.35,-hh); ctx.quadraticCurveTo(-hw*.25,-hh-fL,-hw*.05,-hh); ctx.fill(); ctx.beginPath(); ctx.moveTo(hw*.05,-hh); ctx.quadraticCurveTo(hw*.25,-hh-fL,hw*.35,-hh); ctx.fill(); let bg=ctx.createLinearGradient(-hw,0,hw,0); if(fl){ bg.addColorStop(0,'#ffffff'); bg.addColorStop(.5,'#ffcccc'); bg.addColorStop(1,'#ffffff'); }else{ bg.addColorStop(0,'#3a0a20'); bg.addColorStop(.2,'#6a1535'); bg.addColorStop(.4,'#a82848'); bg.addColorStop(.5,'#cc3558'); bg.addColorStop(.6,'#a82848'); bg.addColorStop(.8,'#6a1535'); bg.addColorStop(1,'#3a0a20'); } ctx.fillStyle=bg; ctx.beginPath(); ctx.moveTo(0,hh); ctx.lineTo(hw*.5,hh*.4); ctx.lineTo(hw,-hh*.1); ctx.lineTo(hw*.88,-hh*.5); ctx.lineTo(hw*.38,-hh*.32); ctx.lineTo(0,-hh); ctx.lineTo(-hw*.38,-hh*.32); ctx.lineTo(-hw*.88,-hh*.5); ctx.lineTo(-hw,-hh*.1); ctx.lineTo(-hw*.5,hh*.4); ctx.closePath(); ctx.fill(); if(!fl){ ctx.fillStyle='rgba(50,8,25,.45)'; ctx.beginPath(); ctx.moveTo(-hw,-hh*.1); ctx.lineTo(-hw*.65,hh*.12); ctx.lineTo(-hw*.5,hh*.4); ctx.lineTo(-hw*.6,-hh*.02); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(hw,-hh*.1); ctx.lineTo(hw*.65,hh*.12); ctx.lineTo(hw*.5,hh*.4); ctx.lineTo(hw*.6,-hh*.02); ctx.closePath(); ctx.fill(); ctx.fillStyle='rgba(180,30,60,.35)'; ctx.beginPath(); ctx.moveTo(-hw,-hh*.1); ctx.lineTo(-hw*1.05,-hh*.25); ctx.lineTo(-hw*.85,-hh*.5); ctx.lineTo(-hw*.88,-hh*.5); ctx.lineTo(-hw,-hh*.1); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(hw,-hh*.1); ctx.lineTo(hw*1.05,-hh*.25); ctx.lineTo(hw*.85,-hh*.5); ctx.lineTo(hw*.88,-hh*.5); ctx.lineTo(hw,-hh*.1);         function drawLvUI(){ const barW=Math.min(200,cw*.3),barH=4,barX=cw/2-barW/2,barY=28; ctx.fillStyle='rgba(255,255,255,.1)'; ctx.fillRect(barX,barY,barW,barH); if(lvConf&&!lvConf.isBoss){ const pr=Math.min(1,killCnt/lvConf.killTarget); ctx.fillStyle='rgba(100,200,255,.6)'; ctx.fillRect(barX,barY,barW*pr,barH); }else if(boss&&boss.phase===1){ const pr=1-boss.hp/boss.maxHp; ctx.fillStyle='rgba(255,100,80,.6)'; ctx.fillRect(barX,barY,barW*pr,barH); } ctx.font='bold 12px Arial'; ctx.textAlign='center'; ctx.fillStyle='rgba(200,220,255,.6)'; ctx.fillText(`LEVEL ${curLv} / ${MAX_LV}`,cw/2,barY-4); if(lvConf&&!lvConf.isBoss){ ctx.font='10px Arial'; ctx.fillStyle='rgba(180,200,220,.5)'; ctx.fillText(`${killCnt}/${lvConf.killTarget}`,cw/2,barY+barH+10); } }
        function drawOverlay(){ if(lvState==='boss_intro'){ const pr=1-lvTimer/140,a=pr<.2?pr/.2:pr>.8?(1-pr)/.2:1; ctx.save(); ctx.globalAlpha=Math.max(0,a); ctx.fillStyle=`rgba(180,30,30,${.15*a})`; ctx.fillRect(0,ch*.35,cw,ch*.3); ctx.font='bold 48px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#ff3333'; const sk=Math.sin(Date.now()*.03)*3; ctx.fillText('WARNING',cw/2+sk,ch*.45); ctx.font='bold 20px Arial'; ctx.fillStyle='#ffaaaa'; ctx.fillText(`BOSS Lv.${curLv}`,cw/2,ch*.55); ctx.restore(); } if(lvState==='clear'){ const pr=1-lvTimer/100,a=pr<.15?pr/.15:pr>.7?(1-pr)/.3:1; ctx.save(); ctx.globalAlpha=Math.max(0,a); ctx.font='bold 36px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#44ff88'; ctx.fillText('LEVEL CLEAR',cw/2,ch*.45); ctx.font='18px Arial'; ctx.fillStyle='#88ffbb'; ctx.fillText(`+${10+curLv*2} Score`,cw/2,ch*.55); ctx.restore(); } if(lvState==='victory'){ const a=Math.min(1,(360-lvTimer)/60); ctx.save(); ctx.globalAlpha=Math.max(0,a); const hue=(Date.now()*.1)%360; ctx.font='bold 52px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=`hsl(${hue},80%,65%)`; ctx.fillText('VICTORY',cw/2,ch*.38); ctx.font='22px Arial'; ctx.fillStyle='#ffdd88'; ctx.fillText(`All ${MAX_LV} Levels Cleared!`,cw/2,ch*.5); ctx.font='16px Arial'; ctx.fillStyle='rgba(200,220,255,.7)'; ctx.fillText('Restarting...',cw/2,ch*.58); ctx.restore(); } }
        function drawUI(){ const ip=ch>cw; if(ip){ ctx.font='bold 18px "Courier New",monospace'; const bw=Math.min(280,cw-20),bh=70,bx=10,by=ch-bh-10; ctx.fillStyle='rgba(0,0,0,.75)'; rr(ctx,bx,by,bw,bh,8); ctx.fill(); ctx.fillStyle='#e0f0ff'; ctx.fillText(`★ ${score}`,bx+12,by+25); ctx.fillText(`◆ ${P.shield}`,bx+120,by+25); ctx.fillText(`▶ Lv${P.wLv}`,bx+12,by+50); let hs=''; for(let i=0;i<P.lives;i++) hs+='♥'; ctx.fillStyle='#ff6b6b'; ctx.fillText(hs,bx+140,by+50); }else{ ctx.font='bold 20px "Courier New",monospace'; ctx.fillStyle='rgba(0,0,0,.65)'; rr(ctx,10,ch-62,340,50,8); ctx.fill(); ctx.fillStyle='#e0f0ff'; ctx.fillText(`★ ${score}  ◆${P.shield}  ▶Lv${P.wLv}`,18,ch-32); ctx.font='16px monospace'; for(let i=0;i<P.lives;i++) ctx.fillText('♥',140+i*20,ch-32); } let ap=[]; if(P.slowT>0) ap.push({i:'⏱',t:Math.ceil(P.slowT/60),c:'#aa88ff'}); if(P.aimT>0) ap.push({i:'◎',t:Math.ceil(P.aimT/60),c:'#ff88ff'}); if(P.fireT>0) ap.push({i:'⚡',t:Math.ceil(P.fireT/60),c:'#ff8844'}); if(P.magT>0) ap.push({i:'⊕',t:Math.ceil(P.magT/60),c:'#44ff88'}); if(P.wingT>0) ap.push({i:'◈',t:Math.ceil(P.wingT/60),c:'#4488ff'}); if(P.bshT>0) ap.push({i:'◉',t:Math.ceil(P.bshT/60),c:'#00ffff'}); if(ap.length){ const py=10,pp=5; ctx.fillStyle='rgba(0,0,0,.6)'; rr(ctx,10,py,ap.length*58+20,22,6); ctx.fill(); ap.forEach((p,i)=>{ ctx.fillStyle=p.c; ctx.font='bold 14px Arial'; ctx.textAlign='left'; ctx.fillText(`${p.i}${p.t}s`,15+pp+i*58,py+16); }); } ctx.font='bold 13px Arial'; ctx.textAlign='right'; ctx.fillStyle=manual?'#45B7D1':'#4CAF50'; ctx.globalAlpha=.85; ctx.fillText(manual?'MANUAL':'AUTO',cw-12,10); ctx.globalAlpha=.5; ctx.font='11px Arial'; ctx.fillStyle='#707070'; ctx.textAlign='center'; ctx.fillText('SPACE 切换模式',cw/2,10); ctx.globalAlpha=1; drawLvUI(); }
        function drawModeNote(){ if(!modeNote) return; const el=Date.now()-modeNote.t; if(el>modeNote.dur){ modeNote=null; return; } const p=el/modeNote.dur,a=p<.15?p/.15:1-Math.pow((p-.15)/.85,.5),sc=1+p*.15; ctx.save(); ctx.globalAlpha=Math.max(0,a); const fs=42*sc; ctx.font=`bold ${fs}px Arial`; ctx.textAlign='center'; ctx.textBaseline='middle'; const cx2=cw/2,cy2=ch*.2,tw=ctx.measureText(modeNote.text).width,pd=24; ctx.fillStyle='rgba(0,0,0,.55)'; rr(ctx,cx2-tw/2-pd,cy2-fs/2-pd/2,tw+pd*2,fs+pd,12); ctx.fill(); ctx.fillStyle=modeNote.text==='AUTO'?'#4CAF50':'#45B7D1'; ctx.fillText(modeNote.text,cx2,cy2); ctx.restore(); }
        function drawCursor(){ ctx.save(); ctx.strokeStyle='rgba(126,200,224,.7)'; ctx.lineWidth=1.5; const s=8; ctx.beginPath(); ctx.moveTo(mX-s,mY); ctx.lineTo(mX-s/3,mY); ctx.moveTo(mX+s/3,mY); ctx.lineTo(mX+s,mY); ctx.moveTo(mX,mY-s); ctx.lineTo(mX,mY-s/3); ctx.moveTo(mX,mY+s/3); ctx.lineTo(mX,mY+s); ctx.stroke(); ctx.fillStyle='rgba(126,200,224,.5)'; ctx.beginPath(); ctx.arc(mX,mY,2,0,Math.PI*2); ctx.fill(); ctx.restore(); }
        function drawTrail(){ if(!trail.length) return; for(let i=0;i<trail.length;i++){ const p=trail[i],fade=Math.max(0,1-p.age/2.5); if(fade<=0) continue; const hue=(Date.now()*.008+i*18)%360; ctx.fillStyle=`hsla(${hue},75%,65%,${fade*.65})`; const sz=5+2*fade; ctx.beginPath(); ctx.arc(p.x,p.y,sz/2,0,Math.PI*2); ctx.fill(); } }
        function draw(){ ctx.fillStyle='#000'; ctx.fillRect(0,0,cw,ch); for(let s of stars) s.draw(ctx); drawEP(); for(let e of enemies) drawE(e); drawEB(); drawBoss(); drawP(); drawWing(); drawBullets(); drawPow(); ctx.save(); for(let p of cParts) p.draw(ctx); ctx.restore(); drawTrail(); drawCursor(); drawUI(); drawOverlay(); drawModeNote(); }
        function resize(){ cw=window.innerWidth; ch=window.innerHeight; canvas.width=cw; canvas.height=ch; P.x=cw/2-C.PW/2; P.y=ch-80; P.lives=C.MAX_LIVES; P.shield=99; P.wLv=Math.min(P.wLv,C.MAX_WLV); if(score<0) score=0; enemies=[]; bullets=[]; eBullets=[]; powerups=[]; shootCD=0; spawnCD=8; initStars(); trail=[]; cParts=[]; eParts=[]; initLv(curLv); }
        window.addEventListener('resize',resize);
        function loop(){ if(!canvas.isConnected) return; update(); for(let s of stars) s.update(); for(let i=0;i<trail.length;i++) trail[i].age+=.2; trail=trail.filter(t=>t.age<2.5); for(let i=cParts.length-1;i>=0;i--){ cParts[i].update(); if(cParts[i].l<=0) cParts.splice(i,1); } updBoss(); updateEP(); draw(); animId=requestAnimationFrame(loop); }
        function init(){ resize(); running=true; initLv(1); loop(); }
        init();
    })();
    function updateClock(){ const n=new Date(); document.querySelector('.time').innerText=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`; document.querySelector('.date').innerText=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')} 星期${'日一二三四五六'[n.getDay()]}`; }
    setInterval(updateClock,1000); updateClock();
    document.querySelector('.time').addEventListener('dblclick',()=>window.location.href='index.html');
</script>
</body>
