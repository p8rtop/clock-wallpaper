<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>自动飞机大战 · 智能躲避 | 时钟壁纸</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #000000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: none;
            z-index: 1;
        }
        .clock {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: rgba(220, 235, 255, 0.94);
            pointer-events: none;
            z-index: 999;
            font-family: 'Segoe UI', 'Orbitron', monospace;
            text-shadow: 0 0 8px rgba(0,0,0,0.6), 0 0 2px rgba(100,150,255,0.5);
            letter-spacing: 2px;
        }
        .time {
            font-size: 100px;
            font-weight: 700;
            margin-bottom: 20px;
            background: transparent;
            padding: 0;
            backdrop-filter: none;
            border: none;
            box-shadow: none;
            cursor: pointer;
            pointer-events: auto;
        }
        .date {
            font-size: 32px;
            font-weight: 400;
            background: transparent;
            padding: 0;
            backdrop-filter: none;
        }
        @keyframes clockShake {
            0% { transform: translate(0px, 0px) rotate(0deg); }
            20% { transform: translate(-3px, 1px) rotate(-0.6deg); }
            40% { transform: translate(3px, -1px) rotate(0.6deg); }
            60% { transform: translate(-1px, 0.5px) rotate(0.2deg); }
            80% { transform: translate(1px, -0.5px) rotate(-0.2deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }
        .shake-clock {
            animation: clockShake 0.18s ease-in-out 2;
        }
        @media (max-width: 768px) and (orientation: portrait) {
            .time { font-size: 14vw; }
            .date { font-size: 5vw; }
        }
        @media (max-width: 1024px) and (orientation: landscape) {
            .time { font-size: 10vh; }
            .date { font-size: 3.5vh; }
        }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div class="clock">
    <div class="time">00:00:00</div>
    <div class="date">2025-01-01 星期四</div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        let ctx = canvas.getContext('2d');
        const clockContainer = document.querySelector('.clock');

        let cw = window.innerWidth;
        let ch = window.innerHeight;

        const brickColors = [
            '#6b7096', '#79948a', '#9a7a7a', '#7a8a9a', '#8a7a9a',
            '#6a8a7a', '#8a8a6a', '#7a6a8a', '#8a7a6a', '#6a7a8a'
        ];

        const CONFIG = {
            PLAYER_W: 28, PLAYER_H: 28,
            INVINCIBLE_FRAMES: 28,
            MAX_LIVES: 5,
            MAX_SHIELD: 99,
            BULLET_W: 5, BULLET_H: 12,
            BULLET_SPEED: -7.5,
            AUTO_SHOOT_DELAY: 4,
            ENEMY_BASE_W: 28, ENEMY_BASE_H: 28,
            ENEMY_SPEED_Y_MIN: 1.6, ENEMY_SPEED_Y_MAX: 2.9,
            ENEMY_SPAWN_FRAMES: 32,
            MAX_ENEMIES: 10,
            ENEMY_BULLET_W: 4, ENEMY_BULLET_H: 8,
            ENEMY_BULLET_SPEED: 4.8,
            ENEMY_SHOOT_DELAY_FRAMES: 65,
            ATTRACT_ENEMY_FORCE: 3.2,
            AVOID_ENEMY_FORCE_BASE: 2.5,
            AVOID_ENEMY_URGENT_FORCE: 6.5,
            AVOID_BULLET_FORCE: 2.4,
            ATTRACT_POWERUP_FORCE: 4.5,
            PATROL_FORCE: 0.5,
            MAX_STEER: 8.0,
            POWERUP_DROP_RATE: 0.28,
            POWERUP_PICKUP_RADIUS: 32,
            SHIELD_COST: 10,
            STAR_COUNT: 150,
            TRAIL_LENGTH: 10,
            COLLISION_PARTICLES: 12,
            MAX_WEAPON_LEVEL: 3,
            TIME_SLOW_DURATION: 420,
            AUTO_AIM_DURATION: 600,
            FIRE_BOOST_DURATION: 600,
            MAGNET_DURATION: 900,
            WINGMAN_DURATION: 900,
            BULLET_SHIELD_DURATION: 1800,
            BOMB_DAMAGE_RADIUS: 300
        };

        let gameRunning = true;
        let animationId = null;
        let modeNotification = null;

        let player = {
            x: cw/2 - 14, y: ch - 80,
            w: CONFIG.PLAYER_W, h: CONFIG.PLAYER_H,
            lives: CONFIG.MAX_LIVES,
            shield: 99,
            invincibleTimer: 0,
            weaponLevel: 0,
            timeSlowTimer: 0,
            autoAimTimer: 0,
            fireBoostTimer: 0,
            magnetTimer: 0,
            wingmanTimer: 0,
            bulletShieldTimer: 0
        };

        let wingmen = [];

        // 引擎粒子尾迹
        let engineParticles = [];

        function updateWingmen() {
            if (player.wingmanTimer > 0) {
                wingmen = [
                    { x: player.x - 25, y: player.y + 5 },
                    { x: player.x + player.w + 5, y: player.y + 5 }
                ];
            } else {
                wingmen = [];
            }
        }

        function shootWingmen() {
            if (wingmen.length === 0) return;
            wingmen.forEach(wingman => {
                const cx = wingman.x + 6;
                const cy = wingman.y - 6;
                bullets.push({ x: cx - CONFIG.BULLET_W/2, y: cy, w: CONFIG.BULLET_W, h: CONFIG.BULLET_H, damage: 1 });
            });
        }

        let bullets = [];
        let enemies = [];
        let enemyBullets = [];
        let powerups = [];
        let score = 0;
        let shootCooldown = 0;
        let enemySpawnCounter = 12;

        let keyboardControl = {
            left: false, right: false, up: false, down: false
        };

        let collisionParticles = [];
        let stars = [];
        let mouseTrail = [];
        let currentMouseX = cw/2, currentMouseY = ch/2;

        function triggerClockShake() {
            if (!clockContainer) return;
            clockContainer.classList.add('shake-clock');
            setTimeout(() => clockContainer.classList.remove('shake-clock'), 240);
        }

        function tryAutoBuyShield() {
            while (score >= CONFIG.SHIELD_COST && player.shield < CONFIG.MAX_SHIELD) {
                score -= CONFIG.SHIELD_COST;
                player.shield++;
                addCollisionEffect(player.x + player.w/2, player.y + player.h/2, '#88ffaa');
            }
        }

        function addScore(amount) {
            score += amount;
            tryAutoBuyShield();
        }

        function activateScreenBomb() {
            enemies.forEach(e => {
                addCollisionEffect(e.x + e.w/2, e.y + e.h/2, '#ff4444');
            });
            enemies = [];
            enemyBullets.forEach(eb => {
                addCollisionEffect(eb.x + eb.w/2, eb.y + eb.h/2, '#ffaa44');
            });
            enemyBullets = [];
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fillRect(0, 0, cw, ch);
            triggerClockShake();
            addScore(10);
        }

        function refreshCooldowns() {
            player.invincibleTimer = 0;
            addCollisionEffect(player.x + player.w/2, player.y + player.h/2, '#ffff00');
        }

        class CollisionParticle {
            constructor(x, y, vx, vy, color, size, life) {
                this.x = x; this.y = y; this.vx = vx; this.vy = vy;
                this.color = color; this.size = size; this.life = life; this.maxLife = life;
            }
            update() { this.x += this.vx; this.y += this.vy; this.vy += 0.12; this.life--; }
            draw(ctx) {
                let alpha = Math.min(1, this.life / this.maxLife * 0.9);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function addCollisionEffect(px, py, baseColor = '#ffaa66') {
            for (let i = 0; i < CONFIG.COLLISION_PARTICLES; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = 1.0 + Math.random() * 3;
                let vx = Math.cos(angle) * speed;
                let vy = Math.sin(angle) * speed;
                let size = 2 + Math.random() * 4;
                let life = 10 + Math.random() * 12;
                let color = baseColor;
                if (Math.random() > 0.6) color = '#ff8855';
                if (Math.random() > 0.8) color = '#ffdd99';
                collisionParticles.push(new CollisionParticle(px, py, vx, vy, color, size, life));
            }
        }

        function updateParticles() {
            for (let i = collisionParticles.length - 1; i >= 0; i--) {
                collisionParticles[i].update();
                if (collisionParticles[i].life <= 0) collisionParticles.splice(i, 1);
            }
        }

        function drawParticles() { ctx.save(); for (let p of collisionParticles) p.draw(ctx); ctx.restore(); }

        class Star {
            constructor() {
                this.x = Math.random() * cw; this.y = Math.random() * ch;
                this.size = 0.7 + Math.random() * 2.2;
                this.alpha = 0.3 + Math.random() * 0.7;
                this.speedX = (Math.random() - 0.5) * 0.04;
                this.speedY = (Math.random() - 0.5) * 0.04 + 0.02;
                this.twinkleSpeed = 0.6 + Math.random() * 2.2;
                this.phase = Math.random() * Math.PI * 2;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < -10) this.x = cw + 10;
                if (this.x > cw + 10) this.x = -10;
                if (this.y < -10) this.y = ch + 10;
                if (this.y > ch + 10) this.y = -10;
                this.alpha = 0.3 + 0.5 * (0.7 + 0.4 * Math.sin(Date.now() * 0.002 * this.twinkleSpeed + this.phase));
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.min(0.9, Math.max(0.2, this.alpha));
                ctx.fillStyle = `rgba(220, 230, 255, ${ctx.globalAlpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }
        }
        function initStars() { stars = []; for (let i=0; i<CONFIG.STAR_COUNT; i++) stars.push(new Star()); }
        function updateStars() { for (let s of stars) s.update(); }
        function drawStars() { for (let s of stars) s.draw(ctx); }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const sx = canvas.width / rect.width, sy = canvas.height / rect.height;
            let mx = (e.clientX - rect.left) * sx, my = (e.clientY - rect.top) * sy;
            mx = Math.min(cw, Math.max(0, mx)); my = Math.min(ch, Math.max(0, my));
            currentMouseX = mx; currentMouseY = my;
            mouseTrail.unshift({ x: mx, y: my, age: 0 });
            if (mouseTrail.length > CONFIG.TRAIL_LENGTH) mouseTrail.pop();
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const sx = canvas.width / rect.width, sy = canvas.height / rect.height;
            let mx = (touch.clientX - rect.left) * sx, my = (touch.clientY - rect.top) * sy;
            mx = Math.min(cw, Math.max(0, mx)); my = Math.min(ch, Math.max(0, my));
            currentMouseX = mx; currentMouseY = my;
            mouseTrail.unshift({ x: mx, y: my, age: 0 });
            if (mouseTrail.length > CONFIG.TRAIL_LENGTH) mouseTrail.pop();
        });
        canvas.addEventListener('touchstart', (e) => e.preventDefault());

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
                isManualMode = !isManualMode;
                triggerClockShake();
                showModeNotification(isManualMode ? 'MANUAL' : 'AUTO');
                return;
            }
            switch(e.key) {
                case 'ArrowLeft': keyboardControl.left = true; break;
                case 'ArrowRight': keyboardControl.right = true; break;
                case 'ArrowUp': keyboardControl.up = true; break;
                case 'ArrowDown': keyboardControl.down = true; break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch(e.key) {
                case 'ArrowLeft': keyboardControl.left = false; break;
                case 'ArrowRight': keyboardControl.right = false; break;
                case 'ArrowUp': keyboardControl.up = false; break;
                case 'ArrowDown': keyboardControl.down = false; break;
            }
        });

        function updateTrail() { for (let i=0; i<mouseTrail.length; i++) mouseTrail[i].age += 0.2; mouseTrail = mouseTrail.filter(t => t.age < 2.5); }

        function showModeNotification(mode) {
            modeNotification = { text: mode, startTime: Date.now(), duration: 900 };
        }

        function drawModeNotification() {
            if (!modeNotification) return;
            const elapsed = Date.now() - modeNotification.startTime;
            if (elapsed > modeNotification.duration) { modeNotification = null; return; }
            const progress = elapsed / modeNotification.duration;
            const alpha = progress < 0.15 ? progress / 0.15 : 1 - Math.pow((progress - 0.15) / 0.85, 0.5);
            const scale = 1 + progress * 0.15;
            ctx.save();
            ctx.globalAlpha = Math.max(0, alpha);
            const baseFontSize = 42;
            const fontSize = baseFontSize * scale;
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const centerX = cw / 2;
            const centerY = ch * 0.2;
            const textWidth = ctx.measureText(modeNotification.text).width;
            const pad = 24;
            const rx = centerX - textWidth/2 - pad;
            const ry = centerY - fontSize/2 - pad/2;
            const rw = textWidth + pad * 2;
            const rh = fontSize + pad;
            const r = 12;
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.beginPath();
            ctx.moveTo(rx + r, ry);
            ctx.lineTo(rx + rw - r, ry);
            ctx.quadraticCurveTo(rx + rw, ry, rx + rw, ry + r);
            ctx.lineTo(rx + rw, ry + rh - r);
            ctx.quadraticCurveTo(rx + rw, ry + rh, rx + rw - r, ry + rh);
            ctx.lineTo(rx + r, ry + rh);
            ctx.quadraticCurveTo(rx, ry + rh, rx, ry + rh - r);
            ctx.lineTo(rx, ry + r);
            ctx.quadraticCurveTo(rx, ry, rx + r, ry);
            ctx.closePath();
            ctx.fill();
            const isAuto = modeNotification.text === 'AUTO';
            ctx.fillStyle = isAuto ? '#4CAF50' : '#45B7D1';
            ctx.fillText(modeNotification.text, centerX, centerY);
            ctx.globalAlpha = Math.max(0, alpha * 0.6);
            ctx.font = `${14 * scale}px Arial`;
            ctx.fillStyle = '#c0c0c0';
            ctx.fillText(isAuto ? 'AI 自动躲避' : '方向键控制移动', centerX, centerY + fontSize / 2 + 14);
            ctx.restore();
        }

        function drawRainbowTrail() {
            if (!mouseTrail.length) return;
            for (let i=0; i<mouseTrail.length; i++) {
                const p = mouseTrail[i];
                const fade = Math.max(0, 1 - p.age/2.5);
                if (fade <= 0) continue;
                const hue = (Date.now() * 0.008 + i * 18) % 360;
                ctx.fillStyle = `hsla(${hue}, 75%, 65%, ${fade*0.65})`;
                const sz = 5 + 2*fade;
                ctx.beginPath();
                ctx.arc(p.x, p.y, sz / 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawPixelCursor(x, y) {
            ctx.save();
            // 改为小十字准星
            ctx.strokeStyle = 'rgba(126, 200, 224, 0.7)';
            ctx.lineWidth = 1.5;
            const cs = 8;
            ctx.beginPath();
            ctx.moveTo(x - cs, y); ctx.lineTo(x - cs/3, y);
            ctx.moveTo(x + cs/3, y); ctx.lineTo(x + cs, y);
            ctx.moveTo(x, y - cs); ctx.lineTo(x, y - cs/3);
            ctx.moveTo(x, y + cs/3); ctx.lineTo(x, y + cs);
            ctx.stroke();
            ctx.fillStyle = 'rgba(126, 200, 224, 0.5)';
            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        let isManualMode = false;

        function updatePlayerAI() {
            if (player.invincibleTimer > 0) player.invincibleTimer--;

            const useKeyboard = isManualMode && (keyboardControl.left || keyboardControl.right || keyboardControl.up || keyboardControl.down);

            if (useKeyboard) {
                const moveSpeed = 5;
                if (keyboardControl.left) player.x -= moveSpeed;
                if (keyboardControl.right) player.x += moveSpeed;
                if (keyboardControl.up) player.y -= moveSpeed;
                if (keyboardControl.down) player.y += moveSpeed;
            } else {
                let forceX = 0, forceY = 0;
                let pc = { x: player.x + player.w/2, y: player.y + player.h/2 };
                let closestEnemy = null, closestDist = Infinity;

                for (let e of enemies) {
                    let ec = { x: e.x + e.w/2, y: e.y + e.h/2 };
                    let d2 = (pc.x - ec.x)**2 + (pc.y - ec.y)**2;
                    if (d2 < closestDist) { closestDist = d2; closestEnemy = e; }
                }

                if (closestEnemy) {
                    let tx = closestEnemy.x + closestEnemy.w/2, ty = closestEnemy.y + closestEnemy.h/2;
                    let dx = tx - pc.x, dy = ty - pc.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist > 0.1) {
                        let attract = CONFIG.ATTRACT_ENEMY_FORCE * Math.min(1.8, 130 / (dist + 15));
                        if (dist < 40) attract *= 0.6;
                        forceX += (dx / dist) * attract;
                        forceY += (dy / dist) * attract;
                    }
                }

                for (let p of powerups) {
                    let boxCenter = { x: p.x + p.w/2, y: p.y + p.h/2 };
                    let dx = boxCenter.x - pc.x;
                    let dy = boxCenter.y - pc.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist < 250 && dist > 0.1) {
                        let attractStrength = CONFIG.ATTRACT_POWERUP_FORCE * (1 - dist / 250);
                        if (p.type === 'weapon' && player.weaponLevel < CONFIG.MAX_WEAPON_LEVEL) {
                            attractStrength *= 1.5;
                        } else if (p.type === 'shield' && player.shield < CONFIG.MAX_SHIELD) {
                            attractStrength *= 1.3;
                        }
                        forceX += (dx / dist) * attractStrength;
                        forceY += (dy / dist) * attractStrength;
                    }
                }

                for (let e of enemies) {
                    let ec = { x: e.x + e.w/2, y: e.y + e.h/2 };
                    let dx = pc.x - ec.x;
                    let dy = pc.y - ec.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist < 0.1) dist = 0.1;
                    let avoidStrength = 0;
                    if (dist < 45) {
                        avoidStrength = CONFIG.AVOID_ENEMY_URGENT_FORCE * (1 + (45 - dist) / 20);
                        avoidStrength = Math.min(avoidStrength, 10.0);
                    } else if (dist < 85) {
                        avoidStrength = CONFIG.AVOID_ENEMY_FORCE_BASE * (1 - (dist - 45) / 40);
                        avoidStrength = Math.max(avoidStrength, 1.2);
                    }
                    if (avoidStrength > 0) {
                        forceX += (dx / dist) * avoidStrength;
                        forceY += (dy / dist) * avoidStrength;
                    }
                }

                for (let eb of enemyBullets) {
                    let bc = { x: eb.x + eb.w/2, y: eb.y + eb.h/2 };
                    let dx = pc.x - bc.x, dy = pc.y - bc.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist < 80 && dist > 0.1) {
                        let threat = CONFIG.AVOID_BULLET_FORCE / (dist * 0.2 + 7);
                        forceX += (dx / dist) * threat;
                        forceY += (dy / dist) * threat;
                    }
                }

                if (enemies.length === 0 && powerups.length === 0) {
                    let t = Date.now() * 0.004;
                    forceX += Math.sin(t) * 2.2;
                    forceY += Math.cos(t * 0.9) * 1.4;
                } else {
                    forceX += (Math.random() - 0.5) * 0.4;
                    forceY += (Math.random() - 0.5) * 0.3;
                }

                let mag = Math.hypot(forceX, forceY);
                if (mag > CONFIG.MAX_STEER) {
                    forceX = forceX / mag * CONFIG.MAX_STEER;
                    forceY = forceY / mag * CONFIG.MAX_STEER;
                }
                let nx = player.x + forceX, ny = player.y + forceY;
                player.x = nx; player.y = ny;
            }

            player.x = Math.min(Math.max(4, player.x), cw - player.w - 4);
            player.y = Math.min(Math.max(30, player.y), ch - player.h - 15);
        }

        function shootWeapon() {
            const cx = player.x + player.w/2;
            const cy = player.y - 6;
            const lvl = player.weaponLevel;
            if (lvl === 0) {
                bullets.push({ x: cx - CONFIG.BULLET_W/2, y: cy, w: CONFIG.BULLET_W, h: CONFIG.BULLET_H, damage: 1 });
            } else if (lvl === 1) {
                bullets.push({ x: cx - CONFIG.BULLET_W/2 - 5, y: cy, w: CONFIG.BULLET_W, h: CONFIG.BULLET_H, damage: 1 });
                bullets.push({ x: cx - CONFIG.BULLET_W/2 + 5, y: cy, w: CONFIG.BULLET_W, h: CONFIG.BULLET_H, damage: 1 });
            } else if (lvl === 2) {
                bullets.push({ x: cx - CONFIG.BULLET_W/2, y: cy, w: CONFIG.BULLET_W, h: CONFIG.BULLET_H, damage: 1, angle: -0.2 });
                bullets.push({ x: cx - CONFIG.BULLET_W/2, y: cy, w: CONFIG.BULLET_W, h: CONFIG.BULLET_H, damage: 1, angle: 0 });
                bullets.push({ x: cx - CONFIG.BULLET_W/2, y: cy, w: CONFIG.BULLET_W, h: CONFIG.BULLET_H, damage: 1, angle: 0.2 });
            } else if (lvl === 3) {
                bullets.push({ x: cx - CONFIG.BULLET_W/2, y: cy, w: CONFIG.BULLET_W, h: CONFIG.BULLET_H, damage: 1, angle: -0.3 });
                bullets.push({ x: cx - CONFIG.BULLET_W/2, y: cy, w: CONFIG.BULLET_W, h: CONFIG.BULLET_H, damage: 1, angle: -0.1 });
                bullets.push({ x: cx - CONFIG.BULLET_W/2, y: cy, w: CONFIG.BULLET_W, h: CONFIG.BULLET_H, damage: 1, angle: 0.1 });
                bullets.push({ x: cx - CONFIG.BULLET_W/2, y: cy, w: CONFIG.BULLET_W, h: CONFIG.BULLET_H, damage: 1, angle: 0.3 });
            }
        }

        function updateBullets() {
            let speedMultiplier = player.timeSlowTimer > 0 ? 0.5 : 1;

            for (let i=0; i<bullets.length; i++) {
                let b = bullets[i];

                if (player.autoAimTimer > 0 && enemies.length > 0) {
                    let closestEnemy = null;
                    let minDist = Infinity;
                    let bulletCenterX = b.x + b.w/2;
                    let bulletCenterY = b.y + b.h/2;

                    for (let e of enemies) {
                        let dist = Math.hypot((e.x + e.w/2) - bulletCenterX, (e.y + e.h/2) - bulletCenterY);
                        if (dist < minDist) {
                            minDist = dist;
                            closestEnemy = e;
                        }
                    }

                    if (closestEnemy) {
                        let targetX = closestEnemy.x + closestEnemy.w/2;
                        let dx = targetX - bulletCenterX;
                        b.x += Math.sign(dx) * Math.min(Math.abs(dx) * 0.1, 3);
                    }
                } else if (b.angle) {
                    b.x += Math.sin(b.angle) * 1.2;
                }

                b.y += CONFIG.BULLET_SPEED * speedMultiplier;
                if (b.y + b.h < 0 || b.y > ch) { bullets.splice(i,1); i--; }
            }
        }

        function handleBulletEnemyCollision() {
            for (let i=bullets.length-1; i>=0; i--) {
                let b = bullets[i];
                let hit = false;
                for (let j=enemies.length-1; j>=0; j--) {
                    let e = enemies[j];
                    if (b.x < e.x+e.w && b.x+b.w > e.x && b.y < e.y+e.h && b.y+b.h > e.y) {
                        let hpReduce = b.damage || 1;
                        if (!e.hp) e.hp = 1;
                        e.hp -= hpReduce;
                        addCollisionEffect(b.x+b.w/2, b.y+b.h/2, '#ffaa66');
                        if (e.hp <= 0) {
                            addScore(1);
                            if (Math.random() < CONFIG.POWERUP_DROP_RATE) {
                                spawnPowerup(e.x + e.w/2 - 6, e.y + e.h/2 - 6);
                            }
                            enemies.splice(j,1);
                        }
                        hit = true;
                        if (!b.piercing) break;
                    }
                }
                if (hit && !b.piercing) { bullets.splice(i,1); }
            }
        }

        function spawnEnemy() {
            if (enemies.length >= CONFIG.MAX_ENEMIES) return;
            let w = CONFIG.ENEMY_BASE_W + (Math.random() * 6 - 3);
            let h = CONFIG.ENEMY_BASE_H + (Math.random() * 6 - 3);
            let x = Math.random() * (cw - w);
            let y = -h;
            let speedY = CONFIG.ENEMY_SPEED_Y_MIN + Math.random() * (CONFIG.ENEMY_SPEED_Y_MAX - CONFIG.ENEMY_SPEED_Y_MIN);
            let color = brickColors[Math.floor(Math.random() * brickColors.length)];
            let shootTimer = Math.floor(Math.random() * 30);
            enemies.push({ x, y, w, h, speedY, shootTimer, color, hp: 1 });
        }

        function updateEnemiesAndShoot() {
            let speedMultiplier = player.timeSlowTimer > 0 ? 0.5 : 1;

            for (let i=0; i<enemies.length; i++) {
                let e = enemies[i];
                e.y += e.speedY * speedMultiplier;
                if (e.shootTimer <= 0) {
                    let dx = (player.x + player.w/2) - (e.x + e.w/2);
                    let normX = Math.abs(dx) < 0.2 ? 0 : Math.sign(dx) * 0.5;
                    let speedX = normX + (Math.random() - 0.5) * 0.7;
                    enemyBullets.push({
                        x: e.x + e.w/2 - CONFIG.ENEMY_BULLET_W/2,
                        y: e.y + e.h - 2,
                        w: CONFIG.ENEMY_BULLET_W,
                        h: CONFIG.ENEMY_BULLET_H,
                        speedX: speedX,
                        speedY: CONFIG.ENEMY_BULLET_SPEED * speedMultiplier
                    });
                    e.shootTimer = CONFIG.ENEMY_SHOOT_DELAY_FRAMES + Math.floor(Math.random() * 20);
                } else {
                    e.shootTimer--;
                }
            }
            for (let i=enemies.length-1; i>=0; i--) {
                if (enemies[i].y > ch + 120 || enemies[i].y + enemies[i].h < -50) enemies.splice(i,1);
            }
        }

        function updateEnemyBullets() {
            let speedMultiplier = player.timeSlowTimer > 0 ? 0.5 : 1;

            for (let i=0; i<enemyBullets.length; i++) {
                let eb = enemyBullets[i];
                eb.x += eb.speedX;
                eb.y += eb.speedY * speedMultiplier;
                if (eb.x + eb.w < -50 || eb.x > cw+50 || eb.y > ch+100 || eb.y+eb.h < -50) {
                    enemyBullets.splice(i,1);
                    i--;
                }
            }
        }

        function spawnPowerup(x, y) {
            let r = Math.random();
            let type;
            let isWeaponMaxed = player.weaponLevel >= CONFIG.MAX_WEAPON_LEVEL;

            if (r < 0.25) {
                type = isWeaponMaxed ? 'bulletShield' : 'weapon';
            }
            else if (r < 0.40) type = 'score';
            else if (r < 0.65) type = 'shield';
            else if (r < 0.73) type = 'timeSlow';
            else if (r < 0.81) type = 'bomb';
            else if (r < 0.89) type = 'autoAim';
            else if (r < 0.94) type = 'fireBoost';
            else if (r < 0.97) type = 'magnet';
            else type = 'wingman';
            powerups.push({ x: x, y: y, w: 20, h: 20, type: type });
        }

        function updatePowerups() {
            let speedMultiplier = player.timeSlowTimer > 0 ? 0.5 : 1;
            let playerCenter = { x: player.x + player.w/2, y: player.y + player.h/2 };

            for (let i=0; i<powerups.length; i++) {
                let p = powerups[i];

                if (player.magnetTimer > 0) {
                    let boxCenter = { x: p.x + p.w/2, y: p.y + p.h/2 };
                    let dx = playerCenter.x - boxCenter.x;
                    let dy = playerCenter.y - boxCenter.y;
                    let dist = Math.hypot(dx, dy);

                    if (dist > 0) {
                        let speed = 8;
                        p.x += (dx / dist) * speed;
                        p.y += (dy / dist) * speed;
                    }
                } else {
                    p.y += 2.2 * speedMultiplier;
                }

                if (powerups[i].y > ch + 80) { powerups.splice(i,1); i--; }
            }
        }

        function handlePowerupCollection() {
            let playerCenter = { x: player.x + player.w/2, y: player.y + player.h/2 };
            for (let i=0; i<powerups.length; i++) {
                let p = powerups[i];
                let boxCenter = { x: p.x + p.w/2, y: p.y + p.h/2 };
                let dist = Math.hypot(playerCenter.x - boxCenter.x, playerCenter.y - boxCenter.y);

                let pickupRadius = CONFIG.POWERUP_PICKUP_RADIUS;

                if (dist < pickupRadius) {
                    if (p.type === 'weapon') {
                        if (player.weaponLevel < CONFIG.MAX_WEAPON_LEVEL) {
                            player.weaponLevel++;
                            addCollisionEffect(p.x+p.w/2, p.y+p.h/2, '#ffff66');
                        } else {
                            addScore(5);
                            addCollisionEffect(p.x+p.w/2, p.y+p.h/2, '#ccff88');
                        }
                    } else if (p.type === 'score') {
                        addScore(8);
                        addCollisionEffect(p.x+p.w/2, p.y+p.h/2, '#88ff88');
                    } else if (p.type === 'shield') {
                        if (player.shield < CONFIG.MAX_SHIELD) {
                            player.shield = Math.min(player.shield + 5, CONFIG.MAX_SHIELD);
                        } else {
                            addScore(3);
                        }
                        addCollisionEffect(p.x+p.w/2, p.y+p.h/2, '#88aaff');
                    } else if (p.type === 'timeSlow') {
                        player.timeSlowTimer = CONFIG.TIME_SLOW_DURATION;
                        addCollisionEffect(p.x+p.w/2, p.y+p.h/2, '#aa88ff');
                    } else if (p.type === 'bomb') {
                        activateScreenBomb();
                        addCollisionEffect(p.x+p.w/2, p.y+p.h/2, '#ff4444');
                    } else if (p.type === 'autoAim') {
                        player.autoAimTimer = CONFIG.AUTO_AIM_DURATION;
                        addCollisionEffect(p.x+p.w/2, p.y+p.h/2, '#ff88ff');
                    } else if (p.type === 'fireBoost') {
                        player.fireBoostTimer = CONFIG.FIRE_BOOST_DURATION;
                        addCollisionEffect(p.x+p.w/2, p.y+p.h/2, '#ff8844');
                    } else if (p.type === 'magnet') {
                        player.magnetTimer = CONFIG.MAGNET_DURATION;
                        addCollisionEffect(p.x+p.w/2, p.y+p.h/2, '#44ff88');
                    } else if (p.type === 'wingman') {
                        player.wingmanTimer = CONFIG.WINGMAN_DURATION;
                        addCollisionEffect(p.x+p.w/2, p.y+p.h/2, '#4488ff');
                    } else if (p.type === 'bulletShield') {
                        player.bulletShieldTimer = CONFIG.BULLET_SHIELD_DURATION;
                        addCollisionEffect(p.x+p.w/2, p.y+p.h/2, '#00ffff');
                    }
                    powerups.splice(i,1);
                    i--;
                }
            }
        }

        function applyDamage() {
            if (player.shield > 0) {
                player.shield--;
                addCollisionEffect(player.x+player.w/2, player.y+player.h/2, '#88aaff');
                triggerClockShake();
                return;
            }
            player.lives--;
            triggerClockShake();
            addCollisionEffect(player.x+player.w/2, player.y+player.h/2, '#ff7766');
            if (player.lives <= 0) {
                player.lives = CONFIG.MAX_LIVES;
                player.shield = 99;
                player.weaponLevel = 0;
                player.timeSlowTimer = 0;
                player.autoAimTimer = 0;
                player.fireBoostTimer = 0;
                player.magnetTimer = 0;
                player.wingmanTimer = 0;
                player.bulletShieldTimer = 0;
                score = Math.max(0, Math.floor(score / 2));
                enemies = [];
                enemyBullets = [];
                bullets = [];
                powerups = [];
                wingmen = [];
                player.x = cw/2 - player.w/2;
                player.y = ch - 80;
                player.invincibleTimer = CONFIG.INVINCIBLE_FRAMES;
                addCollisionEffect(player.x+player.w/2, player.y+player.h/2, '#ffaa88');
                triggerClockShake();
            } else {
                player.invincibleTimer = CONFIG.INVINCIBLE_FRAMES;
                player.x += (Math.random() - 0.5)*18;
                player.y -= 10;
                player.x = Math.min(Math.max(4, player.x), cw - player.w - 4);
                player.y = Math.min(Math.max(30, player.y), ch - player.h - 15);
            }
        }

        function handlePlayerDamage() {
            if (player.invincibleTimer > 0) return;
            let pr = { x: player.x, y: player.y, w: player.w, h: player.h };
            for (let i=0; i<enemies.length; i++) {
                let e = enemies[i];
                if (pr.x < e.x+e.w && pr.x+pr.w > e.x && pr.y < e.y+e.h && pr.y+pr.h > e.y) {
                    applyDamage();
                    enemies.splice(i,1);
                    return;
                }
            }
            for (let i=0; i<enemyBullets.length; i++) {
                let eb = enemyBullets[i];
                if (pr.x < eb.x+eb.w && pr.x+pr.w > eb.x && pr.y < eb.y+eb.h && pr.y+pr.h > eb.y) {
                    if (player.bulletShieldTimer > 0) {
                        addCollisionEffect(eb.x+eb.w/2, eb.y+eb.h/2, '#00ffff');
                        enemyBullets.splice(i,1);
                        return;
                    }
                    applyDamage();
                    enemyBullets.splice(i,1);
                    return;
                }
            }
        }

        function updateSpawner() {
            if (enemySpawnCounter <= 0) {
                spawnEnemy();
                enemySpawnCounter = CONFIG.ENEMY_SPAWN_FRAMES + Math.floor(Math.random() * 15);
            } else {
                enemySpawnCounter--;
            }
        }

        // ============= 美化后的绘制函数 =============

        // 引擎尾迹粒子系统
        function spawnEngineParticle(x, y, color) {
            engineParticles.push({
                x: x + (Math.random() - 0.5) * 4,
                y: y,
                vx: (Math.random() - 0.5) * 0.8,
                vy: 1 + Math.random() * 2,
                life: 8 + Math.random() * 8,
                maxLife: 16,
                size: 1.5 + Math.random() * 2,
                color: color
            });
        }

        function updateEngineParticles() {
            for (let i = engineParticles.length - 1; i >= 0; i--) {
                let p = engineParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) engineParticles.splice(i, 1);
            }
            // 限制粒子数量
            if (engineParticles.length > 120) {
                engineParticles.splice(0, engineParticles.length - 120);
            }
        }

        function drawEngineParticles() {
            ctx.save();
            for (let p of engineParticles) {
                let alpha = Math.max(0, p.life / p.maxLife * 0.7);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // 辅助：绘制圆角矩形
        function roundRect(ctx, x, y, w, h, r) {
            r = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // ====== 玩家飞机：科幻战斗机 ======
        function drawPlayer() {
            let inv = (player.invincibleTimer > 0) && (Math.floor(Date.now()/60) % 3 < 1);
            if (inv) ctx.globalAlpha = 0.6;

            let cx = player.x + player.w / 2;
            let cy = player.y + player.h / 2;
            const s = 1.6; // 视觉缩放，让飞机更有存在感

            ctx.save();
            ctx.translate(cx, cy);

            // ---- 引擎尾焰 ----
            const t = Date.now() * 0.015;
            const flameFlicker = Math.sin(t * 3.7) * 0.3 + Math.sin(t * 5.3) * 0.2;

            // 主引擎尾焰
            const mainFlameLen = 14 + flameFlicker * 6 + Math.random() * 4;
            let mainFlameGrad = ctx.createLinearGradient(0, 6 * s, 0, 6 * s + mainFlameLen);
            mainFlameGrad.addColorStop(0, 'rgba(200,240,255,0.95)');
            mainFlameGrad.addColorStop(0.15, 'rgba(100,200,255,0.8)');
            mainFlameGrad.addColorStop(0.4, 'rgba(255,160,60,0.6)');
            mainFlameGrad.addColorStop(0.7, 'rgba(255,80,20,0.3)');
            mainFlameGrad.addColorStop(1, 'rgba(255,40,0,0)');
            ctx.fillStyle = mainFlameGrad;
            ctx.beginPath();
            ctx.moveTo(-2.5 * s, 6 * s);
            ctx.quadraticCurveTo(-3.5 * s, 6 * s + mainFlameLen * 0.4, 0, 6 * s + mainFlameLen);
            ctx.quadraticCurveTo(3.5 * s, 6 * s + mainFlameLen * 0.4, 2.5 * s, 6 * s);
            ctx.fill();

            // 侧引擎尾焰
            const sideFlameLen = 8 + flameFlicker * 3 + Math.random() * 3;
            [-1, 1].forEach(side => {
                let sideFlameGrad = ctx.createLinearGradient(side * 6 * s, 4 * s, side * 6 * s, 4 * s + sideFlameLen);
                sideFlameGrad.addColorStop(0, 'rgba(180,230,255,0.8)');
                sideFlameGrad.addColorStop(0.3, 'rgba(80,180,255,0.5)');
                sideFlameGrad.addColorStop(0.7, 'rgba(255,120,40,0.25)');
                sideFlameGrad.addColorStop(1, 'rgba(255,40,0,0)');
                ctx.fillStyle = sideFlameGrad;
                ctx.beginPath();
                ctx.moveTo(side * 5 * s, 4 * s);
                ctx.quadraticCurveTo(side * 6.5 * s, 4 * s + sideFlameLen * 0.5, side * 5.5 * s, 4 * s + sideFlameLen);
                ctx.quadraticCurveTo(side * 5 * s, 4 * s + sideFlameLen * 0.5, side * 7 * s, 4 * s);
                ctx.fill();
            });

            // 引擎发光
            ctx.save();
            ctx.shadowColor = '#4fc3f7';
            ctx.shadowBlur = 10;
            ctx.fillStyle = 'rgba(79,195,247,0.4)';
            ctx.beginPath();
            ctx.ellipse(0, 6 * s, 3 * s, 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // ---- 机身主体 ----
            let bodyGrad = ctx.createLinearGradient(-10 * s, 0, 10 * s, 0);
            bodyGrad.addColorStop(0, '#0d47a1');
            bodyGrad.addColorStop(0.25, '#1976d2');
            bodyGrad.addColorStop(0.45, '#64b5f6');
            bodyGrad.addColorStop(0.55, '#64b5f6');
            bodyGrad.addColorStop(0.75, '#1976d2');
            bodyGrad.addColorStop(1, '#0d47a1');

            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.moveTo(0, -9 * s);              // 机头尖端
            ctx.lineTo(2.5 * s, -6 * s);        // 右上缘
            ctx.lineTo(3.5 * s, -2 * s);        // 右侧中上
            ctx.lineTo(8 * s, 1 * s);            // 右机翼前缘
            ctx.lineTo(9 * s, 3.5 * s);          // 右机翼尖
            ctx.lineTo(4 * s, 2.5 * s);          // 右机翼后缘
            ctx.lineTo(3.5 * s, 5 * s);          // 右下侧
            ctx.lineTo(2 * s, 6.5 * s);          // 右尾翼
            ctx.lineTo(0, 5.5 * s);              // 尾部中心
            ctx.lineTo(-2 * s, 6.5 * s);         // 左尾翼
            ctx.lineTo(-3.5 * s, 5 * s);         // 左下侧
            ctx.lineTo(-4 * s, 2.5 * s);         // 左机翼后缘
            ctx.lineTo(-9 * s, 3.5 * s);         // 左机翼尖
            ctx.lineTo(-8 * s, 1 * s);           // 左机翼前缘
            ctx.lineTo(-3.5 * s, -2 * s);        // 左侧中上
            ctx.lineTo(-2.5 * s, -6 * s);        // 左上缘
            ctx.closePath();
            ctx.fill();

            // 机身暗面（下半部加深）
            let underGrad = ctx.createLinearGradient(0, 0, 0, 7 * s);
            underGrad.addColorStop(0, 'rgba(0,0,0,0)');
            underGrad.addColorStop(1, 'rgba(0,0,30,0.35)');
            ctx.fillStyle = underGrad;
            ctx.beginPath();
            ctx.moveTo(0, -2 * s);
            ctx.lineTo(3.5 * s, 5 * s);
            ctx.lineTo(2 * s, 6.5 * s);
            ctx.lineTo(0, 5.5 * s);
            ctx.lineTo(-2 * s, 6.5 * s);
            ctx.lineTo(-3.5 * s, 5 * s);
            ctx.closePath();
            ctx.fill();

            // 机翼装饰线
            ctx.strokeStyle = 'rgba(100,181,246,0.5)';
            ctx.lineWidth = 0.8;
            // 右翼线
            ctx.beginPath();
            ctx.moveTo(3.5 * s, -1 * s);
            ctx.lineTo(7.5 * s, 2 * s);
            ctx.stroke();
            // 左翼线
            ctx.beginPath();
            ctx.moveTo(-3.5 * s, -1 * s);
            ctx.lineTo(-7.5 * s, 2 * s);
            ctx.stroke();

            // 中脊高光线
            ctx.strokeStyle = 'rgba(144,202,249,0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, -8.5 * s);
            ctx.lineTo(0, 5 * s);
            ctx.stroke();

            // ---- 驾驶舱 ----
            let cockpitGrad = ctx.createRadialGradient(0, -3.5 * s, 0.5 * s, 0, -3.5 * s, 3 * s);
            cockpitGrad.addColorStop(0, 'rgba(220,245,255,0.95)');
            cockpitGrad.addColorStop(0.3, 'rgba(130,210,255,0.85)');
            cockpitGrad.addColorStop(0.7, 'rgba(30,120,200,0.7)');
            cockpitGrad.addColorStop(1, 'rgba(10,60,140,0.5)');
            ctx.fillStyle = cockpitGrad;
            ctx.beginPath();
            ctx.ellipse(0, -3.5 * s, 2 * s, 3.5 * s, 0, 0, Math.PI * 2);
            ctx.fill();

            // 驾驶舱反光
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.beginPath();
            ctx.ellipse(-0.5 * s, -5 * s, 0.8 * s, 1.5 * s, -0.2, 0, Math.PI * 2);
            ctx.fill();

            // 驾驶舱发光
            ctx.save();
            ctx.shadowColor = '#4fc3f7';
            ctx.shadowBlur = 8;
            ctx.strokeStyle = 'rgba(79,195,247,0.5)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.ellipse(0, -3.5 * s, 2 * s, 3.5 * s, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            // ---- 武器挂点指示 ----
            if (player.weaponLevel >= 1) {
                ctx.fillStyle = 'rgba(255,200,80,0.7)';
                ctx.beginPath(); ctx.arc(5 * s, 0, 1.2, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(-5 * s, 0, 1.2, 0, Math.PI * 2); ctx.fill();
            }
            if (player.weaponLevel >= 2) {
                ctx.fillStyle = 'rgba(255,150,50,0.7)';
                ctx.beginPath(); ctx.arc(7 * s, 2 * s, 1, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(-7 * s, 2 * s, 1, 0, Math.PI * 2); ctx.fill();
            }
            if (player.weaponLevel >= 3) {
                ctx.fillStyle = 'rgba(255,100,50,0.8)';
                ctx.beginPath(); ctx.arc(3 * s, -1.5 * s, 1, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(-3 * s, -1.5 * s, 1, 0, Math.PI * 2); ctx.fill();
            }

            // 尾翼尖端灯
            const blink = Math.sin(Date.now() * 0.006) > 0 ? 0.9 : 0.3;
            ctx.fillStyle = `rgba(255,60,60,${blink})`;
            ctx.beginPath(); ctx.arc(2 * s, 6.5 * s, 1, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = `rgba(60,255,60,${blink})`;
            ctx.beginPath(); ctx.arc(-2 * s, 6.5 * s, 1, 0, Math.PI * 2); ctx.fill();

            ctx.restore();

            // 生成引擎尾迹粒子
            if (Math.random() < 0.6) {
                spawnEngineParticle(cx, cy + 6 * s, 'rgba(100,200,255,0.6)');
            }
            if (Math.random() < 0.3) {
                spawnEngineParticle(cx - 6 * s * 0.5, cy + 4 * s, 'rgba(255,160,60,0.5)');
                spawnEngineParticle(cx + 6 * s * 0.5, cy + 4 * s, 'rgba(255,160,60,0.5)');
            }

            if (inv) ctx.globalAlpha = 1;

            // ---- 护盾效果 ----
            if (player.shield > 0) {
                ctx.save();
                const shieldPulse = 0.3 + 0.12 * Math.sin(Date.now() * 0.008);
                ctx.globalAlpha = shieldPulse;

                // 护盾光晕
                let shieldGrad = ctx.createRadialGradient(cx, cy, player.w * 0.4, cx, cy, player.w * 0.95);
                shieldGrad.addColorStop(0, 'rgba(80,180,255,0)');
                shieldGrad.addColorStop(0.5, 'rgba(80,180,255,0.12)');
                shieldGrad.addColorStop(0.8, 'rgba(100,200,255,0.18)');
                shieldGrad.addColorStop(1, 'rgba(80,180,255,0.05)');
                ctx.fillStyle = shieldGrad;
                ctx.beginPath();
                ctx.arc(cx, cy, player.w * 0.95, 0, Math.PI * 2);
                ctx.fill();

                // 护盾环
                ctx.strokeStyle = 'rgba(136,221,255,0.55)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(cx, cy, player.w * 0.85, 0, Math.PI * 2);
                ctx.stroke();

                ctx.restore();
            }

            // 子弹抵消护盾
            if (player.bulletShieldTimer > 0) {
                ctx.save();
                ctx.globalAlpha = 0.3 + 0.1 * Math.sin(Date.now() * 0.012);
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 4]);
                ctx.beginPath();
                ctx.arc(cx, cy, player.w * 0.95, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);

                // 旋转的六边形
                const rotAngle = Date.now() * 0.002;
                ctx.strokeStyle = 'rgba(0,255,255,0.25)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const a = rotAngle + (Math.PI * 2 / 6) * i;
                    const r = player.w * 0.9;
                    const px = cx + Math.cos(a) * r;
                    const py = cy + Math.sin(a) * r;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }
        }

        // ====== 僚机：小型战斗机 ======
        function drawWingmen() {
            wingmen.forEach(wingman => {
                const wx = wingman.x + 6;
                const wy = wingman.y + 5;
                const ws = 0.7; // 僚机缩放

                ctx.save();
                ctx.translate(wx, wy);
                ctx.scale(ws, ws);

                // 尾焰
                const fLen = 5 + Math.random() * 3;
                let fGrad = ctx.createLinearGradient(0, 4, 0, 4 + fLen);
                fGrad.addColorStop(0, 'rgba(200,240,255,0.8)');
                fGrad.addColorStop(0.4, 'rgba(80,180,255,0.5)');
                fGrad.addColorStop(1, 'rgba(255,60,0,0)');
                ctx.fillStyle = fGrad;
                ctx.beginPath();
                ctx.moveTo(-1.5, 4);
                ctx.quadraticCurveTo(0, 4 + fLen, 1.5, 4);
                ctx.fill();

                // 机身
                let bGrad = ctx.createLinearGradient(-6, 0, 6, 0);
                bGrad.addColorStop(0, '#1565c0');
                bGrad.addColorStop(0.5, '#42a5f5');
                bGrad.addColorStop(1, '#1565c0');
                ctx.fillStyle = bGrad;
                ctx.beginPath();
                ctx.moveTo(0, -7);
                ctx.lineTo(2, -4);
                ctx.lineTo(2.5, -1);
                ctx.lineTo(6, 1);
                ctx.lineTo(6.5, 3);
                ctx.lineTo(2.5, 2);
                ctx.lineTo(2, 4.5);
                ctx.lineTo(0, 3.5);
                ctx.lineTo(-2, 4.5);
                ctx.lineTo(-2.5, 2);
                ctx.lineTo(-6.5, 3);
                ctx.lineTo(-6, 1);
                ctx.lineTo(-2.5, -1);
                ctx.lineTo(-2, -4);
                ctx.closePath();
                ctx.fill();

                // 驾驶舱
                ctx.fillStyle = 'rgba(130,210,255,0.8)';
                ctx.beginPath();
                ctx.ellipse(0, -2.5, 1.2, 2.2, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                // 僚机光圈
                ctx.save();
                ctx.globalAlpha = 0.4 + 0.15 * Math.sin(Date.now() * 0.01);
                ctx.strokeStyle = '#4488ff';
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.arc(wx, wy, 10, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                // 僚机尾迹粒子
                if (Math.random() < 0.3) {
                    spawnEngineParticle(wx, wy + 4, 'rgba(66,165,245,0.5)');
                }
            });
        }

        // ====== 敌机：暗黑外星战机 ======
        function drawEnemy(e) {
            let cx = e.x + e.w / 2;
            let cy = e.y + e.h / 2;
            const s = 1.4;

            ctx.save();
            ctx.translate(cx, cy);

            // 尾焰（向上/向前，因为敌机朝下飞）
            const fLen = 5 + Math.random() * 3;
            let fGrad = ctx.createLinearGradient(0, -5 * s, 0, -5 * s - fLen);
            fGrad.addColorStop(0, 'rgba(255,120,50,0.7)');
            fGrad.addColorStop(0.5, 'rgba(255,60,20,0.3)');
            fGrad.addColorStop(1, 'rgba(255,20,0,0)');
            ctx.fillStyle = fGrad;
            ctx.beginPath();
            ctx.moveTo(-1.5 * s, -5 * s);
            ctx.quadraticCurveTo(0, -5 * s - fLen, 1.5 * s, -5 * s);
            ctx.fill();

            // 机身 - 蝙蝠翼外星战机（朝下）
            let baseColor = e.color;
            let bodyGrad = ctx.createLinearGradient(-8 * s, 0, 8 * s, 0);
            bodyGrad.addColorStop(0, shadeColor(baseColor, -35));
            bodyGrad.addColorStop(0.3, shadeColor(baseColor, -10));
            bodyGrad.addColorStop(0.5, shadeColor(baseColor, 25));
            bodyGrad.addColorStop(0.7, shadeColor(baseColor, -10));
            bodyGrad.addColorStop(1, shadeColor(baseColor, -35));

            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.moveTo(0, 8 * s);                // 机头（朝下）
            ctx.lineTo(3 * s, 4 * s);            // 右下
            ctx.lineTo(3.5 * s, 1 * s);          // 右中
            ctx.lineTo(9 * s, -2 * s);           // 右翼尖
            ctx.lineTo(7 * s, -4 * s);           // 右翼后缘
            ctx.lineTo(3 * s, -2 * s);           // 右翼根
            ctx.lineTo(2 * s, -5 * s);           // 右上
            ctx.lineTo(0, -6.5 * s);             // 顶部
            ctx.lineTo(-2 * s, -5 * s);          // 左上
            ctx.lineTo(-3 * s, -2 * s);          // 左翼根
            ctx.lineTo(-7 * s, -4 * s);          // 左翼后缘
            ctx.lineTo(-9 * s, -2 * s);          // 左翼尖
            ctx.lineTo(-3.5 * s, 1 * s);         // 左中
            ctx.lineTo(-3 * s, 4 * s);           // 左下
            ctx.closePath();
            ctx.fill();

            // 机腹暗面
            let underGrad = ctx.createLinearGradient(0, -3 * s, 0, 8 * s);
            underGrad.addColorStop(0, 'rgba(0,0,0,0)');
            underGrad.addColorStop(1, 'rgba(0,0,0,0.3)');
            ctx.fillStyle = underGrad;
            ctx.beginPath();
            ctx.moveTo(0, 2 * s);
            ctx.lineTo(3 * s, 4 * s);
            ctx.lineTo(0, 8 * s);
            ctx.lineTo(-3 * s, 4 * s);
            ctx.closePath();
            ctx.fill();

            // 中脊线
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(0, -6 * s);
            ctx.lineTo(0, 7 * s);
            ctx.stroke();

            // 驾驶舱 - 红色发光眼
            let cockpitGrad = ctx.createRadialGradient(0, 2 * s, 0.5 * s, 0, 2 * s, 2.5 * s);
            cockpitGrad.addColorStop(0, 'rgba(255,100,80,0.95)');
            cockpitGrad.addColorStop(0.4, 'rgba(200,40,40,0.7)');
            cockpitGrad.addColorStop(1, 'rgba(100,15,15,0.4)');
            ctx.fillStyle = cockpitGrad;
            ctx.beginPath();
            ctx.ellipse(0, 2 * s, 1.8 * s, 2.5 * s, 0, 0, Math.PI * 2);
            ctx.fill();

            // 驾驶舱发光
            ctx.save();
            ctx.shadowColor = '#ff3333';
            ctx.shadowBlur = 6;
            ctx.fillStyle = 'rgba(255,60,60,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, 2 * s, 2 * s, 2.8 * s, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 翼尖灯
            const blink = Math.sin(Date.now() * 0.005 + cx) > 0 ? 0.8 : 0.2;
            ctx.fillStyle = `rgba(255,50,50,${blink})`;
            ctx.beginPath(); ctx.arc(8 * s, -2.5 * s, 1, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(-8 * s, -2.5 * s, 1, 0, Math.PI * 2); ctx.fill();

            // HP指示
            if (e.hp > 1) {
                ctx.fillStyle = '#ffaa66';
                roundRect(ctx, -5, -8 * s, 10, 3, 1);
                ctx.fill();
            }

            ctx.restore();
        }

        function shadeColor(color, percent) {
            let R = parseInt(color.slice(1,3),16), G = parseInt(color.slice(3,5),16), B = parseInt(color.slice(5,7),16);
            R = Math.min(255, Math.max(0, R+percent));
            G = Math.min(255, Math.max(0, G+percent));
            B = Math.min(255, Math.max(0, B+percent));
            return `#${((1 << 24) + (R << 16) + (G << 8) + B).toString(16).slice(1)}`;
        }

        // ====== 我方子弹：能量弹 ======
        function drawBullets() {
            for (let b of bullets) {
                const bcx = b.x + b.w / 2;
                const bcy = b.y + b.h / 2;

                // 子弹拖尾
                ctx.save();
                let trailGrad = ctx.createLinearGradient(bcx, b.y, bcx, b.y + b.h + 8);
                if (b.damage === 2) {
                    trailGrad.addColorStop(0, 'rgba(255,170,100,0.7)');
                    trailGrad.addColorStop(1, 'rgba(255,100,30,0)');
                } else {
                    trailGrad.addColorStop(0, 'rgba(255,230,130,0.6)');
                    trailGrad.addColorStop(1, 'rgba(255,187,68,0)');
                }
                ctx.fillStyle = trailGrad;
                ctx.fillRect(b.x + 1, b.y + b.h * 0.3, b.w - 2, b.h + 6);
                ctx.restore();

                // 子弹主体
                ctx.save();
                const bulletColor = b.damage === 2 ? '#ffaa66' : '#ffe680';
                const bulletGlow = b.damage === 2 ? '#ff8844' : '#ffcc44';

                ctx.shadowColor = bulletGlow;
                ctx.shadowBlur = 6;
                ctx.fillStyle = bulletColor;
                ctx.beginPath();
                ctx.ellipse(bcx, bcy, b.w / 2, b.h / 2, 0, 0, Math.PI * 2);
                ctx.fill();

                // 内核高光
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.beginPath();
                ctx.ellipse(bcx, bcy - 1, b.w / 4, b.h / 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // ====== 敌方子弹：红色能量弹 ======
        function drawEnemyBullets() {
            for (let eb of enemyBullets) {
                const bcx = eb.x + eb.w / 2;
                const bcy = eb.y + eb.h / 2;

                // 拖尾
                ctx.save();
                let trailGrad = ctx.createLinearGradient(bcx, eb.y + eb.h, bcx, eb.y - 4);
                trailGrad.addColorStop(0, 'rgba(255,96,69,0.6)');
                trailGrad.addColorStop(1, 'rgba(255,50,30,0)');
                ctx.fillStyle = trailGrad;
                ctx.fillRect(eb.x + 0.5, eb.y - 3, eb.w - 1, eb.h + 4);
                ctx.restore();

                // 子弹主体
                ctx.save();
                ctx.shadowColor = '#ff4422';
                ctx.shadowBlur = 5;
                ctx.fillStyle = '#ff6045';
                ctx.beginPath();
                ctx.ellipse(bcx, bcy, eb.w / 2, eb.h / 2, 0, 0, Math.PI * 2);
                ctx.fill();

                // 内核
                ctx.fillStyle = 'rgba(255,200,150,0.6)';
                ctx.beginPath();
                ctx.ellipse(bcx, bcy - 0.5, eb.w / 4, eb.h / 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // ====== 宝箱绘制 ======
        function drawPowerups() {
            for (let p of powerups) {
                let color;
                switch(p.type) {
                    case 'weapon': color = '#ffaa55'; break;
                    case 'score': color = '#88ff88'; break;
                    case 'shield': color = '#88aaff'; break;
                    case 'timeSlow': color = '#aa88ff'; break;
                    case 'bomb': color = '#ff4444'; break;
                    case 'autoAim': color = '#ff88ff'; break;
                    case 'fireBoost': color = '#ff8844'; break;
                    case 'magnet': color = '#44ff88'; break;
                    case 'wingman': color = '#4488ff'; break;
                    case 'bulletShield': color = '#00ffff'; break;
                    default: color = '#ffffff';
                }

                const pcx = p.x + p.w / 2;
                const pcy = p.y + p.h / 2;
                const pulse = Math.sin(Date.now() * 0.008) * 0.4 + 0.6;

                // 外圈光晕
                ctx.save();
                ctx.globalAlpha = 0.25 + pulse * 0.2;
                let glowGrad = ctx.createRadialGradient(pcx, pcy, 2, pcx, pcy, CONFIG.POWERUP_PICKUP_RADIUS * 0.6);
                glowGrad.addColorStop(0, color);
                glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = glowGrad;
                ctx.beginPath();
                ctx.arc(pcx, pcy, CONFIG.POWERUP_PICKUP_RADIUS * 0.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 宝箱主体 - 圆角菱形
                ctx.save();
                ctx.translate(pcx, pcy);
                const rot = Date.now() * 0.003;
                ctx.rotate(rot);

                ctx.shadowColor = color;
                ctx.shadowBlur = 8;
                ctx.fillStyle = color;
                ctx.beginPath();
                const sz = p.w / 2 + 1;
                ctx.moveTo(0, -sz);
                ctx.lineTo(sz, 0);
                ctx.lineTo(0, sz);
                ctx.lineTo(-sz, 0);
                ctx.closePath();
                ctx.fill();

                // 内部高光
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.beginPath();
                const isz = sz * 0.4;
                ctx.moveTo(0, -isz);
                ctx.lineTo(isz, 0);
                ctx.lineTo(0, isz);
                ctx.lineTo(-isz, 0);
                ctx.closePath();
                ctx.fill();

                ctx.restore();

                // 拾取范围指示圈
                ctx.beginPath();
                ctx.arc(pcx, pcy, CONFIG.POWERUP_PICKUP_RADIUS * 0.7, 0, Math.PI*2);
                ctx.strokeStyle = `rgba(255, 220, 100, ${0.2 + pulse * 0.15})`;
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        function drawUI() {
            const isPortrait = ch > cw;

            if (isPortrait) {
                ctx.font = 'bold 18px "Courier New", monospace';
                const bgWidth = Math.min(280, cw - 20);
                const bgHeight = 70;
                const bgX = 10;
                const bgY = ch - bgHeight - 10;

                ctx.fillStyle = 'rgba(0,0,0,0.75)';
                roundRect(ctx, bgX, bgY, bgWidth, bgHeight, 8);
                ctx.fill();

                ctx.fillStyle = '#e0f0ff';
                ctx.fillText(`⭐ ${score}`, bgX + 12, bgY + 25);
                ctx.fillText(`🛡️ ${player.shield}`, bgX + 120, bgY + 25);
                ctx.fillText(`🔫 Lv${player.weaponLevel}`, bgX + 12, bgY + 50);

                let heartsStr = '';
                for (let i=0; i<player.lives; i++) heartsStr += '♥';
                ctx.fillStyle = '#ff6b6b';
                ctx.fillText(heartsStr, bgX + 140, bgY + 50);

                if (player.invincibleTimer > 0) {
                    ctx.fillStyle = '#ffd93d';
                    ctx.fillText('⚡', bgX + bgWidth - 30, bgY + 25);
                }
            } else {
                ctx.font = 'bold 20px "Courier New", monospace';
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                roundRect(ctx, 10, ch-62, 340, 50, 8);
                ctx.fill();
                ctx.fillStyle = '#e0f0ff';
                ctx.fillText(`⭐ ${score}  🛡️${player.shield}  🔫Lv${player.weaponLevel}`, 18, ch-32);
                ctx.font = '16px monospace';
                for (let i=0; i<player.lives; i++) ctx.fillText('♥', 140 + i*20, ch-32);
                if (player.invincibleTimer > 0) ctx.fillText('⚡', 220, ch-32);
            }

            let activePowers = [];
            if (player.timeSlowTimer > 0) {
                activePowers.push({ icon: '⏱️', time: Math.ceil(player.timeSlowTimer / 60), color: '#aa88ff' });
            }
            if (player.autoAimTimer > 0) {
                activePowers.push({ icon: '🎯', time: Math.ceil(player.autoAimTimer / 60), color: '#ff88ff' });
            }
            if (player.fireBoostTimer > 0) {
                activePowers.push({ icon: '🔥', time: Math.ceil(player.fireBoostTimer / 60), color: '#ff8844' });
            }
            if (player.magnetTimer > 0) {
                activePowers.push({ icon: '🧲', time: Math.ceil(player.magnetTimer / 60), color: '#44ff88' });
            }
            if (player.wingmanTimer > 0) {
                activePowers.push({ icon: '🛸', time: Math.ceil(player.wingmanTimer / 60), color: '#4488ff' });
            }
            if (player.bulletShieldTimer > 0) {
                activePowers.push({ icon: '🛡️', time: Math.ceil(player.bulletShieldTimer / 60), color: '#00ffff' });
            }

            if (activePowers.length > 0) {
                const powerBarHeight = 20;
                const powerBarY = 10;
                const powerBarPadding = 5;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                roundRect(ctx, 10, powerBarY, activePowers.length * 60 + 20, powerBarHeight + 2 * powerBarPadding, 6);
                ctx.fill();

                activePowers.forEach((power, index) => {
                    const x = 10 + powerBarPadding + index * 60;
                    ctx.fillStyle = power.color;
                    ctx.font = 'bold 16px Arial';
                    ctx.fillText(`${power.icon}${power.time}s`, x, powerBarY + powerBarHeight + 2);
                });
            }

            const modeText = isManualMode ? 'MANUAL' : 'AUTO';
            const modeColor = isManualMode ? '#45B7D1' : '#4CAF50';
            ctx.font = 'bold 13px Arial';
            ctx.textAlign = 'right';
            ctx.fillStyle = modeColor;
            ctx.globalAlpha = 0.85;
            const modeWidth = ctx.measureText(modeText).width;
            ctx.fillText(modeText, cw - 12, 10);
            ctx.globalAlpha = 0.6;
            ctx.fillStyle = modeColor;
            const dotX = cw - 12 - modeWidth - 8;
            ctx.beginPath();
            ctx.arc(dotX, 17, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.font = '11px Arial';
            ctx.fillStyle = '#707070';
            ctx.globalAlpha = 0.5;
            ctx.textAlign = 'center';
            ctx.fillText('SPACE 切换模式', cw / 2, 10);

            ctx.globalAlpha = 1;
        }

        function updateGame() {
            if (!gameRunning) return;

            if (player.timeSlowTimer > 0) player.timeSlowTimer--;
            if (player.autoAimTimer > 0) player.autoAimTimer--;
            if (player.fireBoostTimer > 0) player.fireBoostTimer--;
            if (player.magnetTimer > 0) player.magnetTimer--;
            if (player.wingmanTimer > 0) player.wingmanTimer--;
            if (player.bulletShieldTimer > 0) player.bulletShieldTimer--;

            updatePlayerAI();

            let shootDelay = player.fireBoostTimer > 0 ? Math.floor(CONFIG.AUTO_SHOOT_DELAY / 2) : CONFIG.AUTO_SHOOT_DELAY;

            if (shootCooldown <= 0) {
                shootWeapon();
                shootWingmen();
                shootCooldown = shootDelay;
            } else {
                shootCooldown--;
            }

            updateBullets();
            updateEnemiesAndShoot();
            updateEnemyBullets();
            handleBulletEnemyCollision();
            handlePlayerDamage();
            updatePowerups();
            handlePowerupCollection();
            updateSpawner();
            updateWingmen();

            player.x = Math.min(Math.max(4, player.x), cw - player.w - 4);
            player.y = Math.min(Math.max(30, player.y), ch - player.h - 15);
        }

        function draw() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, cw, ch);
            drawStars();

            // 引擎粒子（在飞机后面）
            drawEngineParticles();

            for (let e of enemies) drawEnemy(e);
            drawEnemyBullets();
            drawPlayer();
            drawWingmen();
            drawBullets();
            drawPowerups();
            drawParticles();
            drawRainbowTrail();
            drawPixelCursor(currentMouseX, currentMouseY);
            drawUI();
            drawModeNotification();
        }

        function resizeAndReset() {
            cw = window.innerWidth;
            ch = window.innerHeight;
            canvas.width = cw;
            canvas.height = ch;
            player.x = cw/2 - CONFIG.PLAYER_W/2;
            player.y = ch - 80;
            player.lives = CONFIG.MAX_LIVES;
            player.shield = 99;
            player.weaponLevel = Math.min(player.weaponLevel, CONFIG.MAX_WEAPON_LEVEL);
            if (score < 0) score = 0;
            enemies = [];
            bullets = [];
            enemyBullets = [];
            powerups = [];
            shootCooldown = 0;
            enemySpawnCounter = 8;
            initStars();
            mouseTrail = [];
            collisionParticles = [];
            engineParticles = [];
        }

        window.addEventListener('resize', () => resizeAndReset());

        function gameLoop() {
            if (!canvas.isConnected) return;
            updateGame();
            updateStars();
            updateTrail();
            updateParticles();
            updateEngineParticles();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function init() {
            resizeAndReset();
            gameRunning = true;
            gameLoop();
        }
        init();
    })();

    function updateClock() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2,'0');
        const mm = String(now.getMinutes()).padStart(2,'0');
        const ss = String(now.getSeconds()).padStart(2,'0');
        const year = now.getFullYear();
        const month = String(now.getMonth()+1).padStart(2,'0');
        const day = String(now.getDate()).padStart(2,'0');
        const week = "日一二三四五六"[now.getDay()];
        document.querySelector(".time").innerText = `${hh}:${mm}:${ss}`;
        document.querySelector(".date").innerText = `${year}-${month}-${day} 星期${week}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    document.querySelector('.time').addEventListener('dblclick', function() {
        window.location.href = 'index.html';
    });
</script>
