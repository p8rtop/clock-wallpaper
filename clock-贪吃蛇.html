<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>贪吃蛇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #000000;
            overflow: hidden;
            font-family: Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: none;
            z-index: 1;
        }
        .clock {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #d0d0d0;
            pointer-events: none;
            z-index: 999;
            font-family: Arial, sans-serif;
            text-shadow: 0 0 8px rgba(0,0,0,0.5);
            transition: transform 0.05s ease-out;
        }
        .time {
            font-size: 100px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 4px;
            background: rgba(0,0,0,0.4);
            padding: 0.2em 0.5em;
            border-radius: 24px;
            backdrop-filter: blur(2px);
            cursor: pointer;
            pointer-events: auto;
        }
        .date {
            font-size: 32px;
            color: #909090;
            background: rgba(0,0,0,0.3);
            padding: 0.2em 1em;
            border-radius: 40px;
            backdrop-filter: blur(2px);
        }
        @keyframes clockShake {
            0% { transform: translate(0px, 0px) rotate(0deg); }
            20% { transform: translate(-4px, 2px) rotate(-1deg); }
            40% { transform: translate(4px, -1px) rotate(1deg); }
            60% { transform: translate(-2px, 1px) rotate(0.5deg); }
            80% { transform: translate(2px, -1px) rotate(-0.5deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }
        .shake-clock {
            animation: clockShake 0.12s ease-in-out 2;
        }
        html {
            overflow: hidden;
            background: #000;
        }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div class="clock">
    <div class="time">00:00:00</div>
    <div class="date">2025-01-01 星期一</div>
</div>
<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        let ctx = canvas.getContext('2d');
        const clockContainer = document.querySelector('.clock');
        const timeDiv = document.querySelector('.time');
        const dateDiv = document.querySelector('.date');
        const CONFIG = {
            GRID_SIZE: 20,
            SNAKE_SPEED: 150,
            STAR_COUNT: 130,
            TRAIL_LENGTH: 12,
            FOOD_GLOW_PULSE: 0.003,
            INITIAL_SNAKE_LENGTH: 3,
            SNAKE_HEAD_COLOR: '#4CAF50',
            // 时钟区域额外的安全边距（网格数）
            CLOCK_PADDING: 1,
        };
        let gameRunning = true;
        let animationId = null;
        let canvasWidth = window.innerWidth;
        let canvasHeight = window.innerHeight;
        let snake = [];
        let snakeColors = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = null;
        let lastMoveTime = 0;
        let gridCols = 0;
        let gridRows = 0;
        // 模式控制
        let isManualMode = false;
        let modeNotification = null;
        // 永久尾巴颜色
        let permanentTailColors = [];
        const DEFAULT_SNAKE_COLORS = ['#45a049', '#4CAF50'];
        function isFoodColor(color) {
            return color && !DEFAULT_SNAKE_COLORS.includes(color);
        }
        // ===== 时钟区域障碍物 =====
        // 缓存时钟在网格坐标中的边界，避免每帧重复计算
        let clockGridBounds = null;
        function updateClockGridBounds() {
            const clockRect = getClockRectInCanvas();
            if (!clockRect) { clockGridBounds = null; return; }
            const pad = CONFIG.CLOCK_PADDING;
            clockGridBounds = {
                minX: Math.floor(clockRect.x / CONFIG.GRID_SIZE) - pad,
                maxX: Math.ceil((clockRect.x + clockRect.w) / CONFIG.GRID_SIZE) + pad,
                minY: Math.floor(clockRect.y / CONFIG.GRID_SIZE) - pad,
                maxY: Math.ceil((clockRect.y + clockRect.h) / CONFIG.GRID_SIZE) + pad
            };
        }
        // 判断网格坐标是否落在时钟区域内
        function isInClockArea(gx, gy) {
            if (!clockGridBounds) return false;
            return gx >= clockGridBounds.minX && gx <= clockGridBounds.maxX &&
                gy >= clockGridBounds.minY && gy <= clockGridBounds.maxY;
        }
        // 食物颜色
        const foodColors = [
            '#FF6B6B', '#E056A0', '#45B7D1', '#FFA07A', '#F7DC6F',
            '#BB8FCE', '#85C1E2', '#F8B739', '#FF69B4', '#FF4500'
        ];
        let lastFoodColorIndex = -1;
        function getRandomColor() {
            let colorIndex;
            do {
                colorIndex = Math.floor(Math.random() * foodColors.length);
            } while (colorIndex === lastFoodColorIndex && foodColors.length > 1);
            lastFoodColorIndex = colorIndex;
            return foodColors[colorIndex];
        }
        // ===== 碰撞特效粒子系统 =====
        let collisionParticles = [];
        class CollisionParticle {
            constructor(x, y, vx, vy, color, size, life) {
                this.x = x; this.y = y; this.vx = vx; this.vy = vy;
                this.color = color; this.size = size; this.life = life; this.maxLife = life;
            }
            update() {
                this.x += this.vx; this.y += this.vy; this.vy += 0.15; this.life -= 1;
            }
            draw(ctx) {
                let alpha = Math.min(1, this.life / this.maxLife * 0.9);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = alpha;
                ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
            }
        }
        function addCollisionEffect(px, py, baseColor = '#ffd966') {
            const count = 12;
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = 1.2 + Math.random() * 3;
                let vx = Math.cos(angle) * speed;
                let vy = Math.sin(angle) * speed;
                let size = 2 + Math.random() * 3;
                let life = 12 + Math.random() * 8;
                let color = baseColor;
                if (Math.random() > 0.6) color = '#ffaa88';
                if (Math.random() > 0.8) color = '#ffffff';
                collisionParticles.push(new CollisionParticle(px, py, vx, vy, color, size, life));
            }
        }
        function updateCollisionParticles() {
            for (let i = collisionParticles.length-1; i >= 0; i--) {
                collisionParticles[i].update();
                if (collisionParticles[i].life <= 0) collisionParticles.splice(i,1);
            }
        }
        function drawCollisionParticles() {
            ctx.save();
            for (let p of collisionParticles) p.draw(ctx);
            ctx.restore();
        }
        // ===== 星空粒子系统 =====
        let stars = [];
        class Star {
            constructor() {
                this.x = Math.random() * canvasWidth;
                this.y = Math.random() * canvasHeight;
                this.size = 0.8 + Math.random() * 2.2;
                this.alpha = 0.3 + Math.random() * 0.6;
                this.speedX = (Math.random() - 0.5) * 0.08;
                this.speedY = (Math.random() - 0.5) * 0.05 - 0.02;
                this.twinkleSpeed = 0.5 + Math.random() * 2;
                this.phase = Math.random() * Math.PI * 2;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < -10) this.x = canvasWidth + 5;
                if (this.x > canvasWidth + 10) this.x = -5;
                if (this.y < -10) this.y = canvasHeight + 5;
                if (this.y > canvasHeight + 10) this.y = -10;
                this.alpha = 0.3 + 0.45 * (0.8 + 0.4 * Math.sin(Date.now() * 0.002 * this.twinkleSpeed + this.phase));
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.min(0.85, Math.max(0.2, this.alpha));
                ctx.fillStyle = `rgba(210, 220, 240, ${ctx.globalAlpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                if (this.size > 1.5 && this.alpha > 0.5) {
                    ctx.globalAlpha = 0.2;
                    ctx.fillStyle = '#aaccff';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 1.8, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }
        function initStars() {
            stars = [];
            for (let i = 0; i < CONFIG.STAR_COUNT; i++) stars.push(new Star());
        }
        function updateStars() { for (let s of stars) s.update(); }
        function drawStars() { for (let s of stars) s.draw(ctx); }
        // ===== 彩虹像素拖尾 =====
        let mouseTrail = [];
        let currentMouseX = canvasWidth/2;
        let currentMouseY = canvasHeight/2;
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let mouseX = (e.clientX - rect.left) * scaleX;
            let mouseY = (e.clientY - rect.top) * scaleY;
            mouseX = Math.min(canvasWidth, Math.max(0, mouseX));
            mouseY = Math.min(canvasHeight, Math.max(0, mouseY));
            currentMouseX = mouseX; currentMouseY = mouseY;
            mouseTrail.unshift({ x: mouseX, y: mouseY, age: 0 });
            if (mouseTrail.length > CONFIG.TRAIL_LENGTH) mouseTrail.pop();
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let touchX = (touch.clientX - rect.left) * scaleX;
            let touchY = (touch.clientY - rect.top) * scaleY;
            touchX = Math.min(canvasWidth, Math.max(0, touchX));
            touchY = Math.min(canvasHeight, Math.max(0, touchY));
            currentMouseX = touchX; currentMouseY = touchY;
            mouseTrail.unshift({ x: touchX, y: touchY, age: 0 });
            if (mouseTrail.length > CONFIG.TRAIL_LENGTH) mouseTrail.pop();
        });
        canvas.addEventListener('touchstart', (e) => e.preventDefault());
        function updateTrailAges() {
            for (let i = 0; i < mouseTrail.length; i++) mouseTrail[i].age += 0.2;
            mouseTrail = mouseTrail.filter(t => t.age < 2.5);
        }
        function drawRainbowTrail() {
            if (mouseTrail.length === 0) return;
            for (let i = 0; i < mouseTrail.length; i++) {
                const point = mouseTrail[i];
                const ageFactor = Math.max(0, 1 - point.age / 2.5);
                if (ageFactor <= 0) continue;
                const hue = (Date.now() * 0.008 + i * 18) % 360;
                ctx.fillStyle = `hsl(${hue}, 70%, 65%)`;
                const size = 5 + 2 * ageFactor;
                ctx.fillRect(point.x - size/2, point.y - size/2, size, size);
                ctx.fillStyle = `hsl(${hue}, 80%, 72%)`;
                ctx.fillRect(point.x - size/3, point.y - size/3, size/2, size/2);
            }
            ctx.shadowBlur = 0;
        }
        // 像素小猫光标
        function drawPixelCat(x, y) {
            const catX = x - 10; const catY = y - 12;
            ctx.save(); ctx.imageSmoothingEnabled = false;
            ctx.fillStyle = '#a8a9ad'; ctx.fillRect(catX + 2, catY + 4, 12, 10);
            ctx.fillStyle = '#8f9198'; ctx.fillRect(catX + 4, catY + 2, 2, 3); ctx.fillRect(catX + 10, catY + 2, 2, 3);
            ctx.fillStyle = '#a0a2aa'; ctx.fillRect(catX, catY + 2, 3, 5); ctx.fillRect(catX + 13, catY + 2, 3, 5);
            ctx.fillStyle = '#c7c9ce'; ctx.fillRect(catX + 1, catY + 1, 2, 3); ctx.fillRect(catX + 13, catY + 1, 2, 3);
            ctx.fillStyle = '#eaeef2'; ctx.fillRect(catX + 5, catY + 6, 2, 2); ctx.fillRect(catX + 9, catY + 6, 2, 2);
            ctx.fillStyle = '#1a1c1e'; ctx.fillRect(catX + 5, catY + 6, 1, 2); ctx.fillRect(catX + 9, catY + 6, 1, 2);
            ctx.fillStyle = '#e68a8a'; ctx.fillRect(catX + 7, catY + 8, 2, 2);
            ctx.fillStyle = '#b0b3b8'; ctx.fillRect(catX + 3, catY + 8, 2, 1); ctx.fillRect(catX + 11, catY + 8, 2, 1);
            ctx.fillRect(catX + 1, catY + 9, 2, 1); ctx.fillRect(catX + 13, catY + 9, 2, 1);
            ctx.fillStyle = '#d0d2d6'; ctx.fillRect(catX + 2, catY + 10, 2, 1); ctx.fillRect(catX + 12, catY + 10, 2, 1);
            ctx.restore();
        }
        function getClockRectInCanvas() {
            if (!timeDiv || !dateDiv) return null;
            const timeRect = timeDiv.getBoundingClientRect();
            const dateRect = dateDiv.getBoundingClientRect();
            const canvasRect = canvas.getBoundingClientRect();
            if (canvasRect.width === 0) return null;
            const scaleX = canvas.width / canvasRect.width;
            const scaleY = canvas.height / canvasRect.height;
            const left = Math.min(timeRect.left, dateRect.left);
            const right = Math.max(timeRect.right, dateRect.right);
            const top = Math.min(timeRect.top, dateRect.top);
            const bottom = Math.max(timeRect.bottom, dateRect.bottom);
            return {
                x: (left - canvasRect.left) * scaleX,
                y: (top - canvasRect.top) * scaleY,
                w: (right - left) * scaleX,
                h: (bottom - top) * scaleY
            };
        }
        function triggerClockShake() {
            if (!clockContainer) return;
            clockContainer.classList.add('shake-clock');
            setTimeout(() => { clockContainer.classList.remove('shake-clock'); }, 240);
        }
        // ===== 全屏游戏区域计算 =====
        function calculatePlayArea() {
            gridCols = Math.floor(canvasWidth / CONFIG.GRID_SIZE);
            gridRows = Math.floor(canvasHeight / CONFIG.GRID_SIZE);
        }
        // ===== 初始化蛇（全屏区域，避开时钟） =====
        function initSnake() {
            snake = [];
            snakeColors = [];
            // 在屏幕左侧中间位置开始，如果被时钟挡住就向右偏移
            let startX = 4;
            let startY = Math.floor(gridRows / 2);
            if (isInClockArea(startX, startY)) {
                // 找一个不在时钟区域的位置
                for (let x = 0; x < gridCols; x++) {
                    if (!isInClockArea(x, startY)) {
                        startX = x;
                        break;
                    }
                }
            }
            for (let i = 0; i < CONFIG.INITIAL_SNAKE_LENGTH; i++) {
                let sx = startX - i;
                // 穿墙处理
                if (sx < 0) sx += gridCols;
                snake.push({ x: sx, y: startY });
                snakeColors.push('#45a049');
            }
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
        }
        // ===== 生成食物（全屏区域，避开时钟和蛇身） =====
        function generateFood() {
            let newFood; let valid = false;
            let attempts = 0;
            while (!valid && attempts < 5000) {
                attempts++;
                newFood = {
                    x: Math.floor(Math.random() * gridCols),
                    y: Math.floor(Math.random() * gridRows),
                    color: getRandomColor()
                };
                valid = !isInClockArea(newFood.x, newFood.y);
                if (valid) {
                    for (let segment of snake) {
                        if (segment.x === newFood.x && segment.y === newFood.y) { valid = false; break; }
                    }
                }
            }
            food = newFood;
        }
        function resetGame() {
            calculatePlayArea();
            updateClockGridBounds();
            initSnake();
            generateFood();
            collisionParticles = [];
            permanentTailColors = [];
        }
        // ===== 键盘事件 =====
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
                isManualMode = !isManualMode;
                triggerClockShake();
                showModeNotification(isManualMode ? 'MANUAL' : 'AUTO');
                return;
            }
            if (!isManualMode) return;
            switch(e.key) {
                case 'ArrowUp': case 'w': case 'W':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 }; break;
                case 'ArrowDown': case 's': case 'S':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 }; break;
                case 'ArrowLeft': case 'a': case 'A':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 }; break;
                case 'ArrowRight': case 'd': case 'D':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 }; break;
            }
        });
        // ===== 模式切换通知 =====
        function showModeNotification(mode) {
            modeNotification = { text: mode, startTime: Date.now(), duration: 900 };
        }
        function drawModeNotification() {
            if (!modeNotification) return;
            const elapsed = Date.now() - modeNotification.startTime;
            if (elapsed > modeNotification.duration) { modeNotification = null; return; }
            const progress = elapsed / modeNotification.duration;
            const alpha = progress < 0.15 ? progress / 0.15 : 1 - Math.pow((progress - 0.15) / 0.85, 0.5);
            const scale = 1 + progress * 0.15;
            ctx.save();
            ctx.globalAlpha = Math.max(0, alpha);
            const baseFontSize = 42;
            const fontSize = baseFontSize * scale;
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            // 通知显示在屏幕上半部分（避开中央时钟区域）
            const centerX = canvasWidth / 2;
            const centerY = canvasHeight * 0.2;
            const textWidth = ctx.measureText(modeNotification.text).width;
            const pad = 24;
            const rx = centerX - textWidth/2 - pad;
            const ry = centerY - fontSize/2 - pad/2;
            const rw = textWidth + pad * 2;
            const rh = fontSize + pad;
            const r = 12;
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.beginPath();
            ctx.moveTo(rx + r, ry);
            ctx.lineTo(rx + rw - r, ry);
            ctx.quadraticCurveTo(rx + rw, ry, rx + rw, ry + r);
            ctx.lineTo(rx + rw, ry + rh - r);
            ctx.quadraticCurveTo(rx + rw, ry + rh, rx + rw - r, ry + rh);
            ctx.lineTo(rx + r, ry + rh);
            ctx.quadraticCurveTo(rx, ry + rh, rx, ry + rh - r);
            ctx.lineTo(rx, ry + r);
            ctx.quadraticCurveTo(rx, ry, rx + r, ry);
            ctx.closePath();
            ctx.fill();
            const isAuto = modeNotification.text === 'AUTO';
            ctx.fillStyle = isAuto ? '#4CAF50' : '#45B7D1';
            ctx.fillText(modeNotification.text, centerX, centerY);
            ctx.globalAlpha = Math.max(0, alpha * 0.6);
            ctx.font = `${14 * scale}px Arial`;
            ctx.fillStyle = '#c0c0c0';
            ctx.fillText(isAuto ? 'AI 自动寻路' : '方向键 / WASD 控制', centerX, centerY + fontSize / 2 + 14);
            ctx.restore();
        }
        // ===================================================================
        // ===== AI 寻路算法（全屏 + 时钟障碍） =====
        // ===================================================================
        // 构建蛇身障碍物集合
        function getSnakeObstacles(options = {}) {
            const { excludeHead = true, excludeTail = true } = options;
            const obstacles = new Set();
            const start = excludeHead ? 1 : 0;
            const end = excludeTail ? snake.length - 1 : snake.length;
            for (let i = start; i < end; i++) {
                obstacles.add(`${snake[i].x},${snake[i].y}`);
            }
            return obstacles;
        }
        // 穿墙坐标修正
        function wrapX(x) { return ((x % gridCols) + gridCols) % gridCols; }
        function wrapY(y) { return ((y % gridRows) + gridRows) % gridRows; }
        // BFS 寻路（全屏穿墙 + 时钟区域不可进入）
        function findPath(start, target, snakeObstacles) {
            const queue = [[start]];
            const visited = new Set();
            visited.add(`${start.x},${start.y}`);
            const directions = [
                { x: 0, y: -1 }, { x: 0, y: 1 },
                { x: -1, y: 0 }, { x: 1, y: 0 }
            ];
            while (queue.length > 0) {
                const path = queue.shift();
                const current = path[path.length - 1];
                if (current.x === target.x && current.y === target.y) {
                    return path;
                }
                for (let dir of directions) {
                    const nx = wrapX(current.x + dir.x);
                    const ny = wrapY(current.y + dir.y);
                    const key = `${nx},${ny}`;
                    // 检查：已访问 / 蛇身障碍 / 时钟区域障碍
                    if (visited.has(key) || snakeObstacles.has(key) || isInClockArea(nx, ny)) continue;
                    visited.add(key);
                    queue.push([...path, { x: nx, y: ny }]);
                }
            }
            return null;
        }
        // 洪水填充计算可达空间
        function floodFillCount(startX, startY, snakeObstacles) {
            const visited = new Set();
            const queue = [{ x: startX, y: startY }];
            visited.add(`${startX},${startY}`);
            let count = 0;
            while (queue.length > 0) {
                const current = queue.shift();
                count++;
                if (count > snake.length) return count;
                const dirs = [{ x: 0, y: -1 }, { x: 0, y: 1 }, { x: -1, y: 0 }, { x: 1, y: 0 }];
                for (let dir of dirs) {
                    const nx = wrapX(current.x + dir.x);
                    const ny = wrapY(current.y + dir.y);
                    const key = `${nx},${ny}`;
                    // 同样排除时钟区域
                    if (visited.has(key) || snakeObstacles.has(key) || isInClockArea(nx, ny)) continue;
                    visited.add(key);
                    queue.push({ x: nx, y: ny });
                }
            }
            return count;
        }
        // 安全检查：模拟走完路径后能否找到尾巴
        function isPathSafe(pathToFood) {
            const totalCells = gridCols * gridRows;
            if (snake.length < totalCells * 0.3) return true;
            if (pathToFood.length <= 3) return true;
            const simSnake = snake.map(s => ({ x: s.x, y: s.y }));
            for (let step = 1; step < pathToFood.length; step++) {
                const nextPos = pathToFood[step];
                simSnake.unshift({ x: nextPos.x, y: nextPos.y });
                if (food && nextPos.x === food.x && nextPos.y === food.y) {
                    // 吃到食物，蛇增长
                } else {
                    simSnake.pop();
                }
            }
            const simHead = simSnake[0];
            const simTail = simSnake[simSnake.length - 1];
            const simObstacles = new Set();
            for (let i = 1; i < simSnake.length - 1; i++) {
                simObstacles.add(`${simSnake[i].x},${simSnake[i].y}`);
            }
            const pathToTail = findPath(simHead, simTail, simObstacles);
            return pathToTail !== null;
        }
        // 选择可达空间最大的安全方向
        function chooseBestDirection(head, snakeObstacles) {
            const dirs = [
                { x: 0, y: -1 }, { x: 0, y: 1 },
                { x: -1, y: 0 }, { x: 1, y: 0 }
            ];
            let bestDir = null;
            let bestSpace = -1;
            for (let dir of dirs) {
                if (dir.x === -direction.x && dir.y === -direction.y) continue;
                const nx = wrapX(head.x + dir.x);
                const ny = wrapY(head.y + dir.y);
                const key = `${nx},${ny}`;
                if (snakeObstacles.has(key) || isInClockArea(nx, ny)) continue;
                const space = floodFillCount(nx, ny, snakeObstacles);
                if (space > bestSpace) {
                    bestSpace = space;
                    bestDir = { x: dir.x, y: dir.y };
                }
            }
            if (bestDir) {
                nextDirection = bestDir;
            }
        }
        // 从当前蛇头设置走向目标的方向
        function setDirectionToward(head, target) {
            let dx = target.x - head.x;
            let dy = target.y - head.y;
            // 穿墙方向修正：选择更短的路径
            if (dx > gridCols / 2) dx -= gridCols;
            if (dx < -gridCols / 2) dx += gridCols;
            if (dy > gridRows / 2) dy -= gridRows;
            if (dy < -gridRows / 2) dy += gridRows;
            // 确定主方向（取绝对值较大的分量）
            let ndx = 0, ndy = 0;
            if (Math.abs(dx) >= Math.abs(dy)) {
                ndx = dx > 0 ? 1 : -1;
            } else {
                ndy = dy > 0 ? 1 : -1;
            }
            // 不允许反向
            if (ndx !== 0 && direction.x === -ndx) {
                ndx = 0;
                ndy = dy > 0 ? 1 : (dy < 0 ? -1 : 0);
                if (ndy !== 0 && direction.y === -ndy) return false;
            }
            if (ndy !== 0 && direction.y === -ndy) {
                ndy = 0;
                ndx = dx > 0 ? 1 : (dx < 0 ? -1 : 0);
                if (ndx !== 0 && direction.x === -ndx) return false;
            }
            if (ndx === 0 && ndy === 0) return false;
            nextDirection = { x: ndx, y: ndy };
            return true;
        }
        // ===== 主 AI 决策函数 =====
        function updateAutoMode() {
            if (isManualMode) return;
            if (!food) return;
            const head = snake[0];
            const obstacles = getSnakeObstacles({ excludeHead: true, excludeTail: true });
            // 策略 1：安全地到达食物
            const pathToFood = findPath(head, food, obstacles);
            if (pathToFood && pathToFood.length > 1) {
                if (isPathSafe(pathToFood)) {
                    setDirectionToward(head, pathToFood[1]);
                    return;
                }
            }
            // 策略 2：追赶尾巴
            const tail = snake[snake.length - 1];
            const pathToTail = findPath(head, tail, obstacles);
            if (pathToTail && pathToTail.length > 1) {
                setDirectionToward(head, pathToTail[1]);
                return;
            }
            // 策略 3：选择可达空间最大的方向
            const fullObstacles = getSnakeObstacles({ excludeHead: false, excludeTail: true });
            chooseBestDirection(head, fullObstacles);
        }
        // ===== 更新游戏逻辑（全屏穿墙 + 时钟碰撞） =====
        function updateGame(currentTime) {
            if (!gameRunning) return;
            if (currentTime - lastMoveTime < CONFIG.SNAKE_SPEED) return;
            lastMoveTime = currentTime;
            if (!isManualMode) updateAutoMode();
            direction = { ...nextDirection };
            const head = snake[0];
            const newHead = {
                x: wrapX(head.x + direction.x),
                y: wrapY(head.y + direction.y)
            };
            // 碰到时钟区域 → 死亡
            if (isInClockArea(newHead.x, newHead.y)) {
                triggerClockShake();
                addCollisionEffect(
                    head.x * CONFIG.GRID_SIZE + CONFIG.GRID_SIZE / 2,
                    head.y * CONFIG.GRID_SIZE + CONFIG.GRID_SIZE / 2,
                    '#ff4444'
                );
                resetGame();
                return;
            }
            // 碰到自身 → 死亡
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === newHead.x && snake[i].y === newHead.y) {
                    triggerClockShake();
                    addCollisionEffect(
                        newHead.x * CONFIG.GRID_SIZE + CONFIG.GRID_SIZE / 2,
                        newHead.y * CONFIG.GRID_SIZE + CONFIG.GRID_SIZE / 2,
                        '#ff4444'
                    );
                    resetGame();
                    return;
                }
            }
            const ateFood = food && newHead.x === food.x && newHead.y === food.y;
            snake.unshift(newHead);
            if (ateFood) {
                const eatenColor = food.color;
                snakeColors.unshift(eatenColor);
                addCollisionEffect(
                    food.x * CONFIG.GRID_SIZE + CONFIG.GRID_SIZE / 2,
                    food.y * CONFIG.GRID_SIZE + CONFIG.GRID_SIZE / 2,
                    eatenColor
                );
                triggerClockShake();
                generateFood();
            } else {
                snakeColors.unshift(CONFIG.SNAKE_HEAD_COLOR);
                const removedColor = snakeColors[snakeColors.length - 1];
                if (isFoodColor(removedColor)) {
                    permanentTailColors.push(removedColor);
                }
                snake.pop();
                snakeColors.pop();
            }
        }
        // ===== 绘制蛇 =====
        function drawSnake() {
            for (let i = 0; i < snake.length; i++) {
                const segment = snake[i];
                const x = segment.x * CONFIG.GRID_SIZE;
                const y = segment.y * CONFIG.GRID_SIZE;
                let color;
                let isFixed = false;
                if (i === 0) {
                    color = CONFIG.SNAKE_HEAD_COLOR;
                    ctx.fillStyle = color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = color;
                } else {
                    const fromTail = snake.length - 1 - i;
                    if (fromTail < permanentTailColors.length) {
                        color = permanentTailColors[permanentTailColors.length - 1 - fromTail];
                        isFixed = true;
                    } else {
                        color = snakeColors[i];
                    }
                    ctx.fillStyle = color;
                    if (isFixed) {
                        ctx.shadowBlur = 6;
                        ctx.shadowColor = color;
                    } else {
                        ctx.shadowBlur = 0;
                    }
                }
                ctx.fillRect(x + 1, y + 1, CONFIG.GRID_SIZE - 2, CONFIG.GRID_SIZE - 2);
                if (i > 0 && isFoodColor(color)) {
                    if (isFixed) {
                        ctx.strokeStyle = '#FFD700';
                        ctx.lineWidth = 0.1;
                    } else {
                        ctx.strokeStyle = '#FFFFFF';
                        ctx.lineWidth = 2;
                    }
                    ctx.strokeRect(x + 1, y + 1, CONFIG.GRID_SIZE - 2, CONFIG.GRID_SIZE - 2);
                }
                if (i === 0) {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ffffff';
                    const eyeSize = 4;
                    const eyeOffset = 5;
                    if (direction.x === 1) {
                        ctx.fillRect(x + CONFIG.GRID_SIZE - eyeOffset - eyeSize, y + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(x + CONFIG.GRID_SIZE - eyeOffset - eyeSize, y + CONFIG.GRID_SIZE - eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (direction.x === -1) {
                        ctx.fillRect(x + eyeOffset, y + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(x + eyeOffset, y + CONFIG.GRID_SIZE - eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (direction.y === -1) {
                        ctx.fillRect(x + eyeOffset, y + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(x + CONFIG.GRID_SIZE - eyeOffset - eyeSize, y + eyeOffset, eyeSize, eyeSize);
                    } else {
                        ctx.fillRect(x + eyeOffset, y + CONFIG.GRID_SIZE - eyeOffset - eyeSize, eyeSize, eyeSize);
                        ctx.fillRect(x + CONFIG.GRID_SIZE - eyeOffset - eyeSize, y + CONFIG.GRID_SIZE - eyeOffset - eyeSize, eyeSize, eyeSize);
                    }
                }
            }
            ctx.shadowBlur = 0;
        }
        // ===== 绘制食物 =====
        function drawFood() {
            if (!food) return;
            const x = food.x * CONFIG.GRID_SIZE;
            const y = food.y * CONFIG.GRID_SIZE;
            const pulse = Math.sin(Date.now() * CONFIG.FOOD_GLOW_PULSE) * 0.3 + 0.7;
            ctx.shadowBlur = 15;
            ctx.shadowColor = food.color;
            ctx.fillStyle = food.color;
            ctx.globalAlpha = pulse;
            ctx.fillRect(x + 2, y + 2, CONFIG.GRID_SIZE - 4, CONFIG.GRID_SIZE - 4);
            ctx.fillStyle = '#ffffff';
            ctx.globalAlpha = 0.5;
            ctx.fillRect(x + 5, y + 5, 6, 6);
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }
        // ===== 绘制时钟区域障碍边界（淡淡的虚线框提示玩家） =====
        function drawClockBoundary() {
            if (!clockGridBounds) return;
            const b = clockGridBounds;
            const x = b.minX * CONFIG.GRID_SIZE;
            const y = b.minY * CONFIG.GRID_SIZE;
            const w = (b.maxX - b.minX + 1) * CONFIG.GRID_SIZE;
            const h = (b.maxY - b.minY + 1) * CONFIG.GRID_SIZE;
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 8]);
            ctx.strokeRect(x, y, w, h);
            ctx.setLineDash([]);
            ctx.restore();
        }
        // ===== HUD =====
        function drawHUD() {
            ctx.save();
            const score = permanentTailColors.length;
            ctx.font = 'bold 14px Arial';
            ctx.fillStyle = '#d0d0d0';
            ctx.globalAlpha = 0.75;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('SCORE ' + score, 12, 10);
            const isAuto = !isManualMode;
            const modeText = isAuto ? 'AUTO' : 'MANUAL';
            const modeColor = isAuto ? '#4CAF50' : '#45B7D1';
            ctx.font = 'bold 13px Arial';
            ctx.textAlign = 'right';
            ctx.fillStyle = modeColor;
            ctx.globalAlpha = 0.85;
            const modeWidth = ctx.measureText(modeText).width;
            ctx.fillText(modeText, canvasWidth - 12, 10);
            ctx.globalAlpha = 0.6;
            ctx.fillStyle = modeColor;
            const dotX = canvasWidth - 12 - modeWidth - 8;
            ctx.beginPath();
            ctx.arc(dotX, 17, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = '11px Arial';
            ctx.fillStyle = '#707070';
            ctx.globalAlpha = 0.5;
            ctx.textAlign = 'center';
            ctx.fillText('SPACE 切换模式', canvasWidth / 2, 10);
            ctx.restore();
        }
        // ===== 主绘制函数 =====
        function draw() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            drawStars();
            drawClockBoundary();
            drawFood();
            drawSnake();
            drawCollisionParticles();
            drawRainbowTrail();
            drawPixelCat(currentMouseX, currentMouseY);
            drawHUD();
            drawModeNotification();
        }
        function resizeAndReset() {
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            resetGame();
            initStars();
            mouseTrail = [];
            collisionParticles = [];
        }
        window.addEventListener('resize', () => { resizeAndReset(); });
        function gameLoop(currentTime) {
            if (!canvas.isConnected) return;
            updateGame(currentTime);
            updateStars();
            updateTrailAges();
            updateCollisionParticles();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }
        function init() {
            resizeAndReset();
            gameRunning = true;
            // 延迟一帧确保时钟DOM渲染完毕后再计算区域
            requestAnimationFrame(() => {
                updateClockGridBounds();
                resetGame();
                gameLoop(0);
            });
        }
        init();
    })();
    // 独立时钟模块
    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const week = "日一二三四五六"[now.getDay()];
        document.querySelector(".time").innerText = `${h}:${m}:${s}`;
        document.querySelector(".date").innerText = `${year}-${month}-${day} 星期${week}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
    document.querySelector('.time').addEventListener('dblclick', function() {
        window.location.href = 'index.html';
    });
</script>
</body>
